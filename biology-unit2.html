function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function bank(sec="all",type="all"){return Q.filter(x=>(sec==="all"||x[0]===sec)&&(type==="all"||x[1]===type))}
function makeItem(x){return {sec:x[0],type:x[1],q:x[2],a:x[3],opts:sh([x[3],...x[4]]),exp:x[5],page:x[6]}}
function balancedTest(){
 const plan={atoms:5,bonds:6,water:6,building:4,biomol:7,indicators:4,enzymes:8},out=[];
 Object.entries(plan).forEach(([s,n])=>out.push(...sh(Q.filter(x=>x[0]===s)).slice(0,n).map(makeItem)));
 // Ensure the test contains substantial application/data work.
 let nonRecall=out.filter(x=>x.type!=="recall").length;
 if(nonRecall<15){
  const replacements=sh(Q.filter(x=>x[1]!=="recall"&&!out.some(y=>y.q===x[2]))).map(makeItem);
  for(let i=0;i<out.length&&nonRecall<15;i++)if(out[i].type==="recall"){
   const same=replacements.findIndex(r=>r.sec===out[i].sec);if(same>=0){out[i]=replacements.splice(same,1)[0];nonRecall++}
  }
 }
 return sh(out);
}
function home(){
 mode="";app.innerHTML=`<div class="eyebrow">Unit 2 · Packet 2</div><h1>Biochemistry Study Center</h1><p class="sub">Packet-based review and practice for atomic structure, bonding, water, biomolecules, indicators, and enzymes.</p>
 <div class="grid">
  <div class="choice wide" onclick="location.href='biology-unit2-quiz.html'"><h3>Quiz in 2 Days: Macromolecules + Enzymes</h3><p>Focused prep using Packet 1 macromolecules plus Packet 2 indicators and enzymes.</p></div>
  <div class="choice" onclick="reviewView()"><h3>Review Guide</h3><p>Compact Packet 2 facts and relationships.</p></div>
  <div class="choice" onclick="practiceSetup()"><h3>Practice</h3><p>Choose a topic and receive immediate explanations.</p></div>
  <div class="choice" onclick="startTypePractice('apply')"><h3>Application Practice</h3><p>Use the facts in scenarios and experimental situations.</p></div>
  <div class="choice" onclick="startTypePractice('data')"><h3>Graphs & Data</h3><p>Interpret enzyme curves and catalase results.</p></div>
  <div class="choice" onclick="startTest()"><h3>Full Packet 2 Test</h3><p>40 balanced questions with no feedback until submission.</p></div>
  <div class="choice" onclick="weakPractice()"><h3>Practice Weak Areas</h3><p>Targets topics missed on recent full tests.</p></div>
  <div class="choice wide" onclick="historyView()"><h3>Results & Readiness</h3><p>Track full-test scores, topic performance, and consistency.</p></div>
 </div>
 <div class="callout"><strong>Scope:</strong> Unit 2 Packet 2 only. Unit 1 and Packet 1 are intentionally excluded.</div>`;
}
function reviewView(){
 app.innerHTML=`<div class="eyebrow">Unit 2 · Packet 2</div><h1>Review Guide</h1><p class="sub">Short, packet-focused reminders. Practice questions add the next reasoning step.</p>
 <div class="reviewGrid">${REVIEW.map(([h,items])=>`<section class="reviewCard"><h2>${esc(h)}</h2><ul>${items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></section>`).join("")}</div>
 <div class="controls"><button class="btn primary" onclick="practiceSetup()">Practice These Topics</button><button class="btn secondary" onclick="home()">Home</button></div>`;
}
function practiceSetup(){
 app.innerHTML=`<div class="eyebrow">Unit 2 · Packet 2</div><h1>Practice Setup</h1><p class="sub">Choose a topic, question style, and length.</p>
 <div class="row"><select id="sec"><option value="all">All Packet 2 Topics</option>${Object.entries(SECTIONS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select>
 <select id="typ"><option value="all">All Question Styles</option>${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select>
 <select id="cnt"><option>10</option><option selected>15</option><option>20</option><option>30</option></select></div>
 <div class="controls"><button class="btn primary" onclick="startPractice()">Start Practice</button><button class="btn secondary" onclick="home()">Back</button></div>`;
}
function startPractice(secOverride=null,typeOverride=null){
 mode="practice";currentSection=secOverride||document.getElementById("sec")?.value||"all";
 const type=typeOverride||document.getElementById("typ")?.value||"all",available=bank(currentSection,type);
 const n=(secOverride||typeOverride)?15:+(document.getElementById("cnt")?.value||15);
 quiz=sh(available).slice(0,Math.min(n,available.length)).map(makeItem);idx=0;answers=[];selected=null;checked=false;
 if(!quiz.length){practiceSetup();return}question();
}
function startTypePractice(type){startPractice("all",type)}
function startTest(){mode="test";quiz=balancedTest();idx=0;answers=[];selected=null;checked=false;question()}
function question(){
 const x=quiz[idx],answered=answers.filter(Boolean).length;
 app.innerHTML=`<div class="top"><span class="pill">${mode==="test"?"Full Packet 2 Test":"Practice"}</span><span class="pill">Question ${idx+1} of ${quiz.length}</span></div>
 <div class="progress"><div style="width:${idx/quiz.length*100}%"></div></div>
 <div class="sectionTitle">${SECTIONS[x.sec]} · ${TYPES[x.type]} · Packet p. ${x.page}</div><div class="q">${esc(x.q)}</div>
 <div class="answers">${x.opts.map((o,i)=>`<button class="option ${selected===o?"sel":""}" onclick="pick(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}</div><div id="fb"></div>
 <div class="controls">${mode==="practice"?`<button id="check" class="btn primary" onclick="checkPractice()" ${selected===null?"disabled":""}>Check Answer</button>`:`<button class="btn secondary" onclick="prev()" ${idx===0?"disabled":""}>Previous</button><button class="btn primary" onclick="nextTest()">${idx===quiz.length-1?"Review & Submit":"Next"}</button>`}<button class="btn outline" onclick="home()">Quit</button></div>
 ${mode==="test"?`<p class="small muted">${answered} of ${quiz.length} answered. Answers can be changed before submission.</p>`:""}`;
 if(mode==="test"&&answers[idx]){selected=answers[idx].choice;highlightSelected()}
}
function highlightSelected(){[...document.querySelectorAll(".option")].forEach((b,i)=>b.classList.toggle("sel",quiz[idx].opts[i]===selected))}
function pick(i){if(mode==="practice"&&checked)return;selected=quiz[idx].opts[i];highlightSelected();const c=document.getElementById("check");if(c)c.disabled=false;if(mode==="test")answers[idx]={choice:selected}}
function checkPractice(){
 if(selected===null)return;checked=true;const x=quiz[idx],ok=selected===x.a;answers[idx]={choice:selected,ok};
 [...document.querySelectorAll(".option")].forEach((b,i)=>{const o=x.opts[i];if(o===x.a)b.classList.add("correct");else if(o===selected)b.classList.add("wrong");b.disabled=true});
 document.getElementById("fb").innerHTML=`<div class="feedback ${ok?"good":"bad"}"><strong>${ok?"Correct.":"Not quite."}</strong> ${esc(x.exp)}</div>`;
 document.querySelector(".controls").innerHTML=`<button class="btn primary" onclick="nextPractice()">${idx===quiz.length-1?"See Results":"Next Question"}</button><button class="btn outline" onclick="home()">Quit</button>`;
}
function nextPractice(){if(idx===quiz.length-1)return practiceResult();idx++;selected=null;checked=false;question()}
function practiceResult(){const n=answers.filter(a=>a?.ok).length;app.innerHTML=`<div class="eyebrow">Practice complete</div><h1>${Math.round(n/quiz.length*100)}%</h1><p>${n} of ${quiz.length} correct.</p><p class="muted">Practice is for learning and is not added to Full Test history.</p><div class="controls"><button class="btn primary" onclick="practiceSetup()">Practice Again</button><button class="btn secondary" onclick="home()">Home</button></div>`}
function prev(){if(idx>0){idx--;selected=answers[idx]?.choice||null;question()}}
function nextTest(){if(selected!==null)answers[idx]={choice:selected};if(idx<quiz.length-1){idx++;selected=answers[idx]?.choice||null;question()}else reviewSubmit()}
function reviewSubmit(){
 const unanswered=quiz.length-answers.filter(Boolean).length;
 app.innerHTML=`<h1>Submit Full Test?</h1><p class="sub">No answers or explanations have been shown.</p><div class="callout ${unanswered?"":"ready"}"><strong>${unanswered?`${unanswered} question${unanswered>1?"s":""} unanswered.`:"All 40 questions answered."}</strong></div><div class="controls"><button class="btn primary" onclick="submitTest()">Submit Test</button><button class="btn secondary" onclick="backToLast()">Go Back</button></div>`;
}
function backToLast(){idx=quiz.length-1;selected=answers[idx]?.choice||null;question()}
function submitTest(){
 const per={},byType={};Object.keys(SECTIONS).forEach(s=>per[s]={c:0,n:0});Object.keys(TYPES).forEach(t=>byType[t]={c:0,n:0});
 let correct=0;const missed=[];
 quiz.forEach((x,i)=>{const choice=answers[i]?.choice||"No answer",ok=choice===x.a;per[x.sec].n++;byType[x.type].n++;if(ok){correct++;per[x.sec].c++;byType[x.type].c++}else missed.push({sec:x.sec,type:x.type,q:x.q,a:x.a,choice,exp:x.exp,page:x.page})});
 const pct=Math.round(correct/quiz.length*100),rec={schema:1,ts:new Date().toISOString(),score:correct,total:quiz.length,pct,per,byType,missed};
 const hist=getHist();hist.push(rec);localStorage.setItem(key,JSON.stringify(hist.slice(-50)));resultView(rec);
}
function getHist(){try{const x=JSON.parse(localStorage.getItem(key)||"[]");return Array.isArray(x)?x:[]}catch(e){return[]}}
function confidence(hist=getHist()){
 if(hist.length<2)return {ok:false,msg:`Complete ${2-hist.length} more full test${hist.length===1?"":"s"} to measure consistency.`};
 const pass=r=>r.pct>=90&&Object.values(r.per).filter(v=>v.n).every(v=>v.c/v.n>=.75),a=hist.at(-1),b=hist.at(-2);
 return pass(a)&&pass(b)?{ok:true,msg:"Two consecutive tests at 90%+ with every tested topic at 75%+."}:{ok:false,msg:"Target: two consecutive tests at 90%+ with every tested topic at 75%+."};
}
function bars(obj,labels){return Object.entries(obj).filter(([,v])=>v.n).map(([s,v])=>{const p=Math.round(v.c/v.n*100);return `<div class="mastery"><strong><span>${labels[s]}</span><span>${v.c}/${v.n} — ${p}%</span></strong><div class="bar"><i style="width:${p}%"></i></div></div>`}).join("")}
function resultView(r){
 const conf=confidence();app.innerHTML=`<div class="eyebrow">Full Packet 2 Test</div><h1>Test Result</h1><div class="score">${r.pct}%</div><p>${r.score} of ${r.total} correct</p>
 <div class="callout ${conf.ok?"ready":""}"><strong>${conf.ok?"Consistent readiness demonstrated":"Keep building consistency"}</strong><br>${conf.msg}</div>
 <h2>By topic</h2>${bars(r.per,SECTIONS)}<h2>By question style</h2>${bars(r.byType,TYPES)}
 <div class="controls"><button class="btn primary" onclick="missedView()">Review Missed Questions</button><button class="btn secondary" onclick="startTest()">Take Another Test</button><button class="btn outline" onclick="home()">Home</button></div>`;
}
function missedView(){
 const r=getHist().at(-1);if(!r||!r.missed.length){app.innerHTML=`<h1>No Missed Questions</h1><p>Nothing to review from the latest full test.</p><button class="btn primary" onclick="home()">Home</button>`;return}
 app.innerHTML=`<div class="eyebrow">Latest full test</div><h1>Review Missed Questions</h1><p class="sub">Explanations are tied to Packet 2.</p>${r.missed.map(m=>`<div class="missed"><div class="sectionTitle">${SECTIONS[m.sec]} · ${TYPES[m.type]} · Packet p. ${m.page}</div><strong>${esc(m.q)}</strong><p class="small">Your answer: ${esc(m.choice)}<br>Correct answer: <strong>${esc(m.a)}</strong></p><p>${esc(m.exp)}</p></div>`).join("")}<div class="controls"><button class="btn primary" onclick="weakPractice()">Practice Weak Areas</button><button class="btn secondary" onclick="home()">Home</button></div>`;
}
function weakPractice(){
 const h=getHist();if(!h.length){startTypePractice("apply");return}const misses={};Object.keys(SECTIONS).forEach(s=>misses[s]=0);h.slice(-5).forEach(r=>(r.missed||[]).forEach(m=>misses[m.sec]++));
 const ranked=Object.keys(misses).sort((a,b)=>misses[b]-misses[a]).filter(s=>misses[s]>0);if(!ranked.length){startTypePractice("apply");return}
 mode="practice";quiz=sh(Q.filter(x=>ranked.slice(0,2).includes(x[0]))).slice(0,15).map(makeItem);idx=0;answers=[];selected=null;checked=false;question();
}
function historyView(){
 const h=getHist(),conf=confidence(h),best=h.length?Math.max(...h.map(r=>r.pct)):null;
 app.innerHTML=`<div class="eyebrow">Unit 2 · Packet 2</div><h1>Results & Readiness</h1><p class="sub">Only completed 40-question Packet 2 tests appear here.</p>
 <div class="callout ${conf.ok?"ready":""}"><strong>${conf.ok?"Readiness target reached":"Readiness target"}</strong><br>${conf.msg}${best!==null?`<br>Best score: <strong>${best}%</strong>`:""}</div>
 ${h.length?`<table class="history"><thead><tr><th>Test</th><th>Date</th><th>Score</th></tr></thead><tbody>${h.slice().reverse().map((r,i)=>`<tr><td>#${h.length-i}</td><td>${new Date(r.ts).toLocaleString()}</td><td><strong>${r.pct}%</strong> (${r.score}/${r.total})</td></tr>`).join("")}</tbody></table>`:`<p>No full tests completed yet.</p>`}
 <div class="controls"><button class="btn primary" onclick="startTest()">Take Full Test</button><button class="btn secondary" onclick="home()">Home</button>${h.length?`<button class="btn outline" onclick="exportResults()">Export Results</button><button class="btn outline danger" onclick="clearResults()">Clear Results</button>`:""}</div>`;
}
function exportResults(){const blob=new Blob([JSON.stringify(getHist(),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="gibbons_biology_unit2_packet2_results.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function clearResults(){if(confirm("Clear all saved Packet 2 Full Test results on this browser?")){localStorage.removeItem(key);historyView()}}
home();
</script></body></html>
