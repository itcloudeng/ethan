<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Macromolecule + Enzyme Quiz Prep</title>
<style>
:root{--bg:#f3f7f5;--card:#fff;--ink:#17231c;--muted:#647067;--line:#d9e5de;--green:#087f43;--green2:#e8f6ef;--gold:#b98600;--goldbg:#fff8df;--bad:#b42318;--badbg:#fff1f0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.45}.shell{width:min(860px,100%);margin:auto;padding:22px 16px 50px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 8px 28px rgba(18,48,31,.06)}
h1{font-size:clamp(1.55rem,4.5vw,2.2rem);line-height:1.15;margin:0 0 6px}h2{font-size:1.18rem;margin:0 0 8px}.sub,.muted{color:var(--muted)}.sub{margin:0 0 20px}.eyebrow,.sectionTitle{color:var(--green);font-size:.8rem;font-weight:850;letter-spacing:.06em;text-transform:uppercase;margin-bottom:7px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.choice{border:1px solid var(--line);border-radius:14px;padding:17px;background:#fff;cursor:pointer}.choice:hover{border-color:#86aa95}.choice h3{margin:0 0 5px}.choice p{margin:0;color:var(--muted);font-size:.92rem}.choice.wide{grid-column:1/-1}
.btn,select{font:inherit}.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:760;cursor:pointer}.btn:disabled{opacity:.5}.primary{background:var(--green);color:#fff}.secondary{background:#edf3f0;color:var(--ink)}.outline{background:#fff;border:1px solid var(--line)}.danger{color:var(--bad)}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.controls .btn{min-width:120px}.row{display:flex;gap:10px;flex-wrap:wrap}select{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.pill{background:#edf3f0;border-radius:999px;padding:7px 11px;font-size:.86rem;font-weight:750}.progress{height:9px;background:#e8eeea;border-radius:99px;overflow:hidden;margin:14px 0 22px}.progress>div{height:100%;background:var(--green)}.q{font-size:1.18rem;font-weight:780;margin:0 0 16px}.answers{display:grid;gap:10px}.option{width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:13px;padding:14px 15px;font-size:1rem;cursor:pointer}.option.sel,.option.correct{border-color:var(--green);background:var(--green2)}.option.wrong{border-color:var(--bad);background:var(--badbg)}
.feedback{margin-top:14px;padding:12px 14px;border-radius:12px}.feedback.good{background:var(--green2)}.feedback.bad{background:var(--badbg)}.callout{border-left:4px solid var(--gold);background:var(--goldbg);padding:12px 14px;border-radius:8px;margin:14px 0}.ready{border-left-color:var(--green);background:var(--green2)}.small{font-size:.88rem}
.reviewGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.review{border:1px solid var(--line);border-radius:14px;padding:16px}.review ul{margin:7px 0 0;padding-left:20px}.review li{margin:5px 0}.score{font-size:3rem;font-weight:850;line-height:1;margin:12px 0}.mastery{padding:13px;border:1px solid var(--line);border-radius:12px;margin:9px 0}.mastery strong{display:flex;justify-content:space-between;gap:12px}.bar{height:8px;background:#e8eeea;border-radius:99px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--green)}.history{width:100%;border-collapse:collapse}.history th,.history td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--line);font-size:.92rem}.missed{border-top:1px solid var(--line);padding:14px 0}
@media(max-width:620px){body{background:#fff}.shell{padding:0}.card{min-height:100dvh;border:0;border-radius:0;box-shadow:none;padding:19px 15px 32px}.grid,.reviewGrid{grid-template-columns:1fr}.choice.wide{grid-column:auto}.option{min-height:56px}.controls{display:grid}.controls .btn{width:100%}.history th:nth-child(2),.history td:nth-child(2){display:none}}

<body><div class="shell"><main class="card" id="app"></main></div>
<script>
const SECTIONS={macro:"Macromolecules",indicator:"Indicator Tests",enzyme:"Enzymes"};
const TYPES={recall:"Knowledge",apply:"Application",data:"Graph / Data"};
// [section,type,question,answer,distractors,explanation]
const Q=[
["macro","recall","What are the four major macromolecules?","carbohydrates, lipids, proteins, and nucleic acids",["sugars, atoms, cells, and tissues","protons, neutrons, electrons, and ions","acids, bases, enzymes, and indicators"],"These are the four types emphasized in the packets."],
["macro","recall","A small molecular building block is a:","monomer",["polymer","indicator","product"],"Monomers join to make larger molecules."],
["macro","recall","A long molecule made from repeating building blocks is a:","polymer",["monomer","proton","substrate"],"Polymers contain repeating monomers."],
["macro","recall","The monomer of carbohydrates is a:","monosaccharide",["amino acid","nucleotide","fatty acid"],"Monosaccharides are carbohydrate building blocks."],
["macro","recall","The main function of carbohydrates is:","fast energy",["long-term genetic storage","insulation only","lowering activation energy"],"Carbohydrates provide cells with fast energy."],
["macro","recall","Carbohydrates contain C, H, and O in approximately what ratio?","1:2:1",["1:1:1","2:1:2","3:2:1"],"The packet gives the carbohydrate C:H:O ratio as 1:2:1."],
["macro","recall","The packet lists the building blocks of lipids as:","fatty acids",["amino acids","nucleotides","monosaccharides"],"Use the packet's expected wording: fatty acids."],
["macro","recall","Which is a major function of lipids?","long-term energy storage",["fast energy only","copying DNA only","lowering activation energy"],"Lipids provide long-term energy, insulation, and contribute to cell structures."],
["macro","recall","The monomers of proteins are:","amino acids",["fatty acids","nucleotides","monosaccharides"],"Amino acids join to form proteins."],
["macro","recall","Amino acids are joined by:","peptide bonds",["indicator bonds","ionic scales","phosphate groups"],"Peptide bonds connect amino acids."],
["macro","recall","Proteins primarily contain which elements in the packet organizer?","CHON",["CHO","CHONP","HO"],"The organizer uses carbon, hydrogen, oxygen, and nitrogen."],
["macro","recall","The monomers of nucleic acids are:","nucleotides",["amino acids","fatty acids","monosaccharides"],"DNA and RNA are made from nucleotides."],
["macro","recall","A nucleotide contains:","a sugar, phosphate group, and nitrogenous base",["glycerol and three fatty acids","only carbon and hydrogen","two amino acids"],"These are the three nucleotide parts shown in the packet."],
["macro","recall","Nucleic acids contain which elements?","CHONP",["CHO","CHON","CHONS only"],"Nucleic acids contain carbon, hydrogen, oxygen, nitrogen, and phosphorus."],
["macro","recall","Examples of nucleic acids are:","DNA and RNA",["starch and glycogen","fats and oils","amylase and lipase"],"DNA and RNA are nucleic acids."],
["macro","apply","A molecule provides rapid energy and is made of monosaccharides. It is a:","carbohydrate",["lipid","protein","nucleic acid"],"Monosaccharides and fast energy identify carbohydrates."],
["macro","apply","A molecule stores instructions used to build proteins. It is a:","nucleic acid",["carbohydrate","lipid","indicator"],"DNA and RNA carry genetic instructions."],
["macro","apply","A molecule is built from amino acids and can function in transport, defense, or as an enzyme. It is a:","protein",["lipid","carbohydrate","nucleic acid"],"Amino acids and these functions identify proteins."],
["macro","apply","A molecule provides insulation and long-term energy. It is a:","lipid",["carbohydrate","protein","nucleic acid"],"Those are major lipid functions."],
["macro","apply","Which pair contains only carbohydrate examples?","bread and pasta",["DNA and RNA","oils and waxes","enzymes and antibodies"],"Bread and pasta are packet carbohydrate examples."],
["macro","apply","Which pair contains only lipid examples?","fats and oils",["DNA and RNA","bread and candy","enzymes and beans"],"Fats and oils are lipids."],
["macro","recall","The reaction that joins monomers while removing water is:","dehydration synthesis",["hydrolysis","denaturation","evaporative cooling"],"Dehydration synthesis builds larger molecules."],
["macro","recall","The reaction that breaks polymers apart by adding water is:","hydrolysis",["dehydration synthesis","cohesion","ionization"],"Hydrolysis uses water to split molecules."],
["macro","apply","Two monomers join and water is released. This is:","dehydration synthesis",["hydrolysis","denaturation","adhesion"],"Removing water while forming a bond is dehydration synthesis."],
["macro","apply","Digestion adds water to split a polymer. This is:","hydrolysis",["dehydration synthesis","cohesion","evaporative cooling"],"Adding water to break a molecule is hydrolysis."],

["indicator","recall","Iodine changes from amber/brown to black/purple when which substance is present?","starch",["simple sugar","protein","lipid"],"A black/purple iodine result is positive for starch."],
["indicator","recall","Heated Benedict's solution tests for:","simple sugars",["starch","proteins","lipids"],"Benedict's changes from aqua blue toward orange when simple sugars are present."],
["indicator","recall","A translucent spot on dry brown paper is positive for:","lipids",["proteins","starch","nucleic acids"],"Lipids make dry brown paper translucent."],
["indicator","recall","Biuret solution tests for:","proteins",["simple sugars","lipids","starch"],"Biuret changes from denim blue to lilac/purple with protein."],
["indicator","apply","A food sample turns iodine black-purple. What does it contain?","starch",["protein","lipid","DNA only"],"Black/purple is a positive iodine test."],
["indicator","apply","Heated Benedict's changes from aqua blue to orange. What is present?","simple sugar",["protein","starch","nucleic acid"],"The orange color indicates a positive Benedict's test."],
["indicator","apply","After a food sample dries on brown paper, the paper remains translucent. What is present?","lipid",["protein","starch","simple sugar only"],"A translucent dry spot indicates lipid."],
["indicator","apply","Biuret changes from denim blue to lilac. What is present?","protein",["starch","lipid","simple sugar"],"Lilac/purple indicates protein."],
["indicator","apply","Why is an unheated Benedict's test unreliable?","Benedict's test must be heated",["Benedict's only tests proteins","the sample must be dried first","iodine must be added"],"The packet specifically requires heat for Benedict's solution."],

["enzyme","recall","Enzymes are biological:","catalysts",["indicators","monomers","isotopes"],"Biological catalysts increase reaction rates in organisms."],
["enzyme","recall","Enzymes speed reactions by lowering:","activation energy",["atomic number","the number of products","body temperature"],"The energy diagram shows a lower barrier with an enzyme."],
["enzyme","recall","The reactant that binds to an enzyme is the:","substrate",["product","indicator","isotope"],"The substrate fits into the active site."],
["enzyme","recall","The part of an enzyme where the substrate binds is the:","active site",["atomic number","phosphate group","indicator scale"],"The active site has a shape that fits its substrate."],
["enzyme","recall","The molecules made by a reaction are the:","products",["substrates","catalysts","isotopes"],"Products are released after the reaction."],
["enzyme","recall","Enzymes can be used again, so they are:","reusable",["consumed","always denatured","products"],"An enzyme remains available after catalyzing a reaction."],
["enzyme","recall","An enzyme works with particular substrates, so it is:","specific",["random","nonpolar","an isotope"],"Active-site shape gives enzymes specificity."],
["enzyme","recall","A reaction that breaks a molecule down is:","catabolic",["anabolic","cohesive","adhesive"],"Catabolic reactions break down molecules."],
["enzyme","recall","A reaction that builds a larger molecule is:","anabolic",["catabolic","acidic","evaporative"],"Anabolic reactions build molecules."],
["enzyme","recall","All chemical reactions in an organism together are called:","metabolism",["cohesion","denaturation","specific heat"],"Metabolism includes both building and breakdown reactions."],
["enzyme","recall","Loss of an enzyme's normal shape is called:","denaturation",["adhesion","hydrolysis","ionization"],"Denaturation changes the active site's shape."],
["enzyme","recall","Which enzyme breaks down proteins?","protease",["lipase","lactase","DNA polymerase"],"Protease acts on proteins."],
["enzyme","recall","Which enzyme breaks down fats?","lipase",["lactase","protease","RNA polymerase"],"Lipase acts on lipids."],
["enzyme","recall","Which enzyme breaks down lactose?","lactase",["lipase","protease","RNA polymerase"],"Lactase acts on lactose."],
["enzyme","apply","In Protein + Protease → amino acids, the enzyme is:","protease",["protein","amino acids","the arrow"],"Protease is the catalyst and ends in -ase."],
["enzyme","apply","In Fat + Lipase → fatty acids, the substrate is:","fat",["lipase","fatty acids","oxygen"],"The substrate is the starting molecule acted upon."],
["enzyme","apply","In Lactose + Lactase → glucose + galactose, the products are:","glucose and galactose",["lactose and lactase","lactase only","water and oxygen"],"Products appear to the right of the reaction arrow."],
["enzyme","apply","Catalase changes hydrogen peroxide into:","water and oxygen",["glucose and galactose","amino acids","fatty acids"],"The packet reaction is 2H₂O₂ → 2H₂O + O₂."],
["enzyme","apply","An enzyme's active site changes shape. What is the most direct result?","the substrate may no longer fit",["the atomic number increases","the enzyme becomes a lipid","more electrons appear"],"Enzyme function depends on active-site shape."],
["enzyme","apply","Very high temperature permanently unfolds an enzyme. It has:","denatured",["become an isotope","performed adhesion","gained protons"],"High heat can disrupt protein shape."],
["enzyme","data","Below its optimum temperature, raising temperature generally makes enzyme rate:","increase toward the optimum",["drop immediately to zero","stay identical","turn the enzyme into a carbohydrate"],"The temperature curve rises toward the optimum."],
["enzyme","data","Above its optimum temperature, enzyme reaction rate generally:","decreases sharply",["increases forever","remains flat","becomes pH 7"],"Excess heat can denature the enzyme."],
["enzyme","data","The packet graph places trypsin's optimum pH closest to:","pH 9",["pH 2","pH 5","pH 7"],"Trypsin peaks in the basic range near pH 9."],
["enzyme","data","The packet graph places pepsin's optimum pH closest to:","pH 2",["pH 5","pH 7","pH 9"],"Pepsin peaks in a strongly acidic range."],
["enzyme","data","With abundant substrate, increasing enzyme concentration makes reaction rate:","increase",["decrease to zero","remain unchanged","reverse"],"More enzyme molecules provide more active sites."],
["enzyme","data","Why does rate level off as substrate concentration keeps increasing?","all active sites are occupied",["atomic numbers change","substrate becomes an isotope","products become enzymes"],"The enzyme is saturated when all active sites are busy."],
["enzyme","data","Catalase produced 28 mL at 26°C, 36 mL at 32°C, and 19 mL at 43°C. Its optimum in these data is:","32°C",["26°C","43°C","56°C"],"The greatest product amount occurs at 32°C."],
["enzyme","data","Catalase product falls from 36 mL at 32°C to 12 mL at 50°C. The best explanation is:","high temperature reduced activity and may denature catalase",["the reaction gained substrate","catalase became a carbohydrate","temperature had no effect"],"Past the optimum, high temperature reduces activity and can denature the enzyme."],
["enzyme","apply","If more catalase is added while hydrogen peroxide is abundant, the reaction should initially:","speed up",["stop","reverse","produce less oxygen"],"More catalase supplies more active sites."],
["enzyme","apply","The number of each type of atom on both sides of a balanced equation must be:","equal",["greater on the product side","greater on the reactant side","unrelated"],"Matter is rearranged, not created or destroyed."]
];
const REVIEW=[
["Macromolecules",["Carbohydrate: monosaccharide, CHO 1:2:1, fast energy","Lipid: fatty acids, CHO, long-term energy/insulation/cell structure","Protein: amino acids + peptide bonds, CHON, enzymes/structure/defense/transport","Nucleic acid: nucleotide, CHONP, DNA/RNA, instructions for proteins"]],
["Indicator tests",["Iodine: amber/brown → black/purple = starch","Heated Benedict's: aqua blue → orange = simple sugar","Dry brown paper: opaque → translucent = lipid","Biuret: denim blue → lilac/purple = protein"]],
["Enzyme essentials",["Catalysts lower activation energy","Substrate → active site → products; enzymes are reusable and specific","Catabolic breaks down; anabolic builds; both are metabolism","Temperature and pH have optimum values; extremes can denature enzymes","More enzyme increases rate when substrate is available; extra substrate eventually saturates enzymes"]]
];
let mode="",quiz=[],idx=0,answers=[],selected=null,checked=false;const app=document.getElementById("app"),key="gibbonsBioUnit2MacroEnzymeQuizV1";
function sh(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function make(x){return {sec:x[0],type:x[1],q:x[2],a:x[3],opts:sh([x[3],...x[4]]),exp:x[5]}}
function bank(sec="all",type="all"){return Q.filter(x=>(sec==="all"||x[0]===sec)&&(type==="all"||x[1]===type))}
function fullQuiz(){const plan={macro:8,indicator:4,enzyme:8},out=[];Object.entries(plan).forEach(([s,n])=>out.push(...sh(Q.filter(x=>x[0]===s)).slice(0,n).map(make)));let hard=out.filter(x=>x.type!=="recall").length;const pool=sh(Q.filter(x=>x[1]!=="recall"&&!out.some(y=>y.q===x[2]))).map(make);for(let i=0;i<out.length&&hard<8;i++)if(out[i].type==="recall"){const j=pool.findIndex(x=>x.sec===out[i].sec);if(j>=0){out[i]=pool.splice(j,1)[0];hard++}}return sh(out)}
function home(){mode="";app.innerHTML=`<div class="eyebrow">Quiz-focused · Unit 2</div><h1>Macromolecules + Enzymes</h1><p class="sub">Stripped-down preparation for the upcoming quiz: Packet 1 macromolecules plus Packet 2 indicators and enzymes.</p><div class="grid">
<div class="choice" onclick="reviewView()"><h3>5-Minute Review</h3><p>The facts to make automatic.</p></div><div class="choice" onclick="practiceSetup()"><h3>Targeted Practice</h3><p>Choose macromolecules, indicators, or enzymes.</p></div><div class="choice" onclick="startPractice('all','apply')"><h3>Application Practice</h3><p>Use the facts without section-name clues.</p></div><div class="choice" onclick="startPractice('enzyme','data')"><h3>Enzyme Graphs & Data</h3><p>Temperature, pH, concentration, and catalase.</p></div><div class="choice" onclick="startQuiz()"><h3>20-Question Quiz</h3><p>Balanced, mixed, and scored at the end.</p></div><div class="choice" onclick="weakPractice()"><h3>Practice Missed Topics</h3><p>Targets recent quiz mistakes.</p></div><div class="choice wide" onclick="historyView()"><h3>Quiz Results</h3><p>Track scores and readiness.</p></div></div><div class="callout"><strong>Included:</strong> Macromolecules, indicator tests, and enzymes only. Atomic structure, general bonding, and water-property units are excluded.</div><div class="controls"><button class="btn secondary" onclick="location.href='biology-unit2.html'">Broader Unit 2 Study Center</button></div>`}
function reviewView(){app.innerHTML=`<div class="eyebrow">Quiz-focused review</div><h1>5-Minute Review</h1><p class="sub">Read once, then practice without looking.</p><div class="reviewGrid">${REVIEW.map(([h,a])=>`<section class="review"><h2>${h}</h2><ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></section>`).join("")}</div><div class="controls"><button class="btn primary" onclick="startPractice()">Start Practice</button><button class="btn secondary" onclick="home()">Home</button></div>`}
function practiceSetup(){app.innerHTML=`<div class="eyebrow">Quiz-focused practice</div><h1>Choose a Focus</h1><div class="row"><select id="sec"><option value="all">All Quiz Topics</option>${Object.entries(SECTIONS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select><select id="typ"><option value="all">All Styles</option>${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select><select id="cnt"><option>10</option><option selected>15</option><option>20</option></select></div><div class="controls"><button class="btn primary" onclick="startPractice()">Start</button><button class="btn secondary" onclick="home()">Back</button></div>`}
function startPractice(sec=null,type=null){mode="practice";sec=sec||document.getElementById("sec")?.value||"all";type=type||document.getElementById("typ")?.value||"all";const n=(arguments.length?15:+(document.getElementById("cnt")?.value||15));quiz=sh(bank(sec,type)).slice(0,n).map(make);idx=0;answers=[];selected=null;checked=false;if(!quiz.length){practiceSetup();return}question()}
function startQuiz(){mode="quiz";quiz=fullQuiz();idx=0;answers=[];selected=null;checked=false;question()}
function question(){const x=quiz[idx],done=answers.filter(Boolean).length;app.innerHTML=`<div class="top"><span class="pill">${mode==="quiz"?"Quiz Simulation":"Practice"}</span><span class="pill">Question ${idx+1} of ${quiz.length}</span></div><div class="progress"><div style="width:${idx/quiz.length*100}%"></div></div><div class="sectionTitle">${SECTIONS[x.sec]} · ${TYPES[x.type]}</div><div class="q">${esc(x.q)}</div><div class="answers">${x.opts.map((o,i)=>`<button class="option ${selected===o?"sel":""}" onclick="pick(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}</div><div id="fb"></div><div class="controls">${mode==="practice"?`<button id="check" class="btn primary" onclick="checkAnswer()" ${selected===null?"disabled":""}>Check Answer</button>`:`<button class="btn secondary" onclick="prev()" ${idx===0?"disabled":""}>Previous</button><button class="btn primary" onclick="nextQuiz()">${idx===quiz.length-1?"Review & Submit":"Next"}</button>`}<button class="btn outline" onclick="home()">Quit</button></div>${mode==="quiz"?`<p class="small muted">${done} of ${quiz.length} answered.</p>`:""}`;if(mode==="quiz"&&answers[idx]){selected=answers[idx].choice;highlight()}}
function highlight(){[...document.querySelectorAll(".option")].forEach((b,i)=>b.classList.toggle("sel",quiz[idx].opts[i]===selected))}
function pick(i){if(mode==="practice"&&checked)return;selected=quiz[idx].opts[i];highlight();const c=document.getElementById("check");if(c)c.disabled=false;if(mode==="quiz")answers[idx]={choice:selected}}
function checkAnswer(){if(selected===null)return;checked=true;const x=quiz[idx],ok=selected===x.a;answers[idx]={choice:selected,ok};[...document.querySelectorAll(".option")].forEach((b,i)=>{const o=x.opts[i];if(o===x.a)b.classList.add("correct");else if(o===selected)b.classList.add("wrong");b.disabled=true});document.getElementById("fb").innerHTML=`<div class="feedback ${ok?"good":"bad"}"><strong>${ok?"Correct.":"Not quite."}</strong> ${esc(x.exp)}</div>`;document.querySelector(".controls").innerHTML=`<button class="btn primary" onclick="nextPractice()">${idx===quiz.length-1?"See Results":"Next Question"}</button><button class="btn outline" onclick="home()">Quit</button>`}
function nextPractice(){if(idx===quiz.length-1){const n=answers.filter(x=>x?.ok).length;app.innerHTML=`<h1>Practice Complete</h1><div class="score">${Math.round(n/quiz.length*100)}%</div><p>${n} of ${quiz.length} correct.</p><div class="controls"><button class="btn primary" onclick="practiceSetup()">Practice Again</button><button class="btn secondary" onclick="home()">Home</button></div>`;return}idx++;selected=null;checked=false;question()}
function prev(){if(idx>0){idx--;selected=answers[idx]?.choice||null;question()}}function nextQuiz(){if(selected!==null)answers[idx]={choice:selected};if(idx<quiz.length-1){idx++;selected=answers[idx]?.choice||null;question()}else submitPrompt()}
function submitPrompt(){const n=quiz.length-answers.filter(Boolean).length;app.innerHTML=`<h1>Submit Quiz?</h1><div class="callout ${n?"":"ready"}"><strong>${n?`${n} unanswered question${n===1?"":"s"}.`:"All 20 questions answered."}</strong></div><div class="controls"><button class="btn primary" onclick="submitQuiz()">Submit</button><button class="btn secondary" onclick="backToLast()">Go Back</button></div>`}function backToLast(){idx=quiz.length-1;selected=answers[idx]?.choice||null;question()}
function submitQuiz(){const per={};Object.keys(SECTIONS).forEach(s=>per[s]={c:0,n:0});let correct=0;const missed=[];quiz.forEach((x,i)=>{const choice=answers[i]?.choice||"No answer",ok=choice===x.a;per[x.sec].n++;if(ok){correct++;per[x.sec].c++}else missed.push({sec:x.sec,type:x.type,q:x.q,a:x.a,choice,exp:x.exp})});const r={ts:new Date().toISOString(),score:correct,total:quiz.length,pct:Math.round(correct/quiz.length*100),per,missed},h=getHist();h.push(r);localStorage.setItem(key,JSON.stringify(h.slice(-30)));resultView(r)}
function getHist(){try{const h=JSON.parse(localStorage.getItem(key)||"[]");return Array.isArray(h)?h:[]}catch(e){return[]}}
function resultView(r){app.innerHTML=`<div class="eyebrow">Quiz simulation</div><h1>Result</h1><div class="score">${r.pct}%</div><p>${r.score} of ${r.total} correct</p>${Object.entries(r.per).map(([s,v])=>{const p=Math.round(v.c/v.n*100);return `<div class="mastery"><strong><span>${SECTIONS[s]}</span><span>${v.c}/${v.n} — ${p}%</span></strong><div class="bar"><i style="width:${p}%"></i></div></div>`}).join("")}<div class="controls"><button class="btn primary" onclick="missedView()">Review Missed</button><button class="btn secondary" onclick="startQuiz()">Try Again</button><button class="btn outline" onclick="home()">Home</button></div>`}
function missedView(){const r=getHist().at(-1);if(!r||!r.missed.length){app.innerHTML=`<h1>No Missed Questions</h1><p>Perfect score on the latest simulation.</p><button class="btn primary" onclick="home()">Home</button>`;return}app.innerHTML=`<h1>Review Missed</h1>${r.missed.map(m=>`<div class="missed"><div class="sectionTitle">${SECTIONS[m.sec]} · ${TYPES[m.type]}</div><strong>${esc(m.q)}</strong><p class="small">Your answer: ${esc(m.choice)}<br>Correct: <strong>${esc(m.a)}</strong></p><p>${esc(m.exp)}</p></div>`).join("")}<div class="controls"><button class="btn primary" onclick="weakPractice()">Practice Missed Topics</button><button class="btn secondary" onclick="home()">Home</button></div>`}
function weakPractice(){const h=getHist();if(!h.length){startPractice("all","apply");return}const misses={macro:0,indicator:0,enzyme:0};h.slice(-4).forEach(r=>r.missed.forEach(m=>misses[m.sec]++));const top=Object.keys(misses).sort((a,b)=>misses[b]-misses[a])[0];startPractice(top,"all")}
function historyView(){const h=getHist(),best=h.length?Math.max(...h.map(x=>x.pct)):null;app.innerHTML=`<h1>Quiz Results</h1><p class="sub">Only completed 20-question simulations appear here.</p>${best!==null?`<div class="callout ${best>=90?"ready":""}">Best score: <strong>${best}%</strong></div>`:""}${h.length?`<table class="history"><thead><tr><th>Try</th><th>Date</th><th>Score</th></tr></thead><tbody>${h.slice().reverse().map((r,i)=>`<tr><td>#${h.length-i}</td><td>${new Date(r.ts).toLocaleString()}</td><td><strong>${r.pct}%</strong> (${r.score}/${r.total})</td></tr>`).join("")}</tbody></table>`:`<p>No simulations completed yet.</p>`}<div class="controls"><button class="btn primary" onclick="startQuiz()">Take Quiz</button><button class="btn secondary" onclick="home()">Home</button>${h.length?`<button class="btn outline danger" onclick="clearResults()">Clear Results</button>`:""}</div>`}function clearResults(){if(confirm("Clear saved quiz results on this browser?")){localStorage.removeItem(key);historyView()}}
home();
</script></body></html>
