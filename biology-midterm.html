function home(){mode="";app.innerHTML=`
 <div class="eyebrow">Gibbons Honors Biology</div><h1>Midterm Study Center</h1>
 <div class="unitGrid">${Object.entries(UNITS).map(([u,v])=>`<button class="unitChip" onclick="reviewView('${u}')">${v.name}<small>${v.short}</small></button>`).join("")}</div>
 <div class="grid">
  <button class="choice" onclick="reviewView('all')"><h3>Concept Review</h3><p>Concise guides for every midterm unit.</p></button>
  <button class="choice" onclick="practiceSetup()"><h3>Targeted Practice</h3><p>Choose a unit and question style with immediate feedback.</p></button>
  <button class="choice" onclick="startApplication()"><h3>Application + Data</h3><p>Mixed scenarios, predictions, and graph/data reasoning.</p></button>
  <button class="choice" onclick="freeResponseView()"><h3>Free-Response Workshop</h3><p>Four prompts with checklists for planning answers in your own words.</p></button>
  <button class="choice" onclick="startTest()"><h3>40-Question Midterm</h3><p>Eight questions per unit. No feedback until submission.</p></button>
  <button class="choice" onclick="weakPractice()"><h3>Practice Weak Areas</h3><p>Targets the unit missed most often on recent full tests.</p></button>
  <button class="choice wide" onclick="historyView()"><h3>Results and Readiness</h3><p>Track full-test scores, unit performance, and consistency on this browser.</p></button>
 </div>
 <div class="callout"><strong>Readiness target:</strong> two consecutive full tests at 85% or higher, with every unit at 75% or higher.</div>
 `}

function reviewView(unit="all"){
 let units=unit==="all"?Object.keys(UNITS):[unit];
 app.innerHTML=`<div class="eyebrow">Concept Review</div><h1>${unit==="all"?"Midterm Review":UNITS[unit].name+" Review"}</h1><p class="sub">Read for structure, then close this page and explain each idea from memory.</p>
 ${units.map(u=>`<section><h2>${unitName(u)}</h2><p>${REVIEWS[u].intro}</p>${REVIEWS[u].blocks.map(b=>`<div class="reviewCard"><h3>${b[0]}</h3><ul>${b[1].map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}<div class="controls"><button class="btn primary" onclick="startPractice('${u}')">Practice ${UNITS[u].name}</button></div></section>`).join("")}
 <div class="controls"><button class="btn secondary" onclick="home()">Home</button></div>`
}

function practiceSetup(){app.innerHTML=`<div class="eyebrow">Targeted Practice</div><h1>Choose Your Focus</h1><p class="sub">Practice shows feedback after every answer and does not affect full-test history.</p>
 <div class="row"><select id="unit"><option value="all">All Units</option>${Object.entries(UNITS).map(([u,v])=>`<option value="${u}">${v.name}: ${v.short}</option>`).join("")}</select>
 <select id="type"><option value="all">All Question Styles</option>${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select>
 <select id="cnt"><option>10</option><option selected>15</option><option>20</option><option>25</option></select></div>
 <div class="controls"><button class="btn primary" onclick="startPractice()">Start Practice</button><button class="btn secondary" onclick="home()">Back</button></div>`}

function startPractice(unitOverride=null,typeOverride=null){
 mode="practice";currentUnit=unitOverride||document.getElementById("unit")?.value||"all";let type=typeOverride||document.getElementById("type")?.value||"all";let b=bank(currentUnit,type),n=unitOverride?Math.min(12,b.length):Math.min(+(document.getElementById("cnt")?.value||15),b.length);
 if(!b.length){practiceSetup();return}quiz=sh(b).slice(0,n).map(makeItem);idx=0;answers=[];selected=null;checked=false;question()
}
function startApplication(){mode="practice";currentUnit="all";quiz=sh(Q.filter(x=>x[1]!=="recall")).slice(0,20).map(makeItem);idx=0;answers=[];selected=null;checked=false;question()}
function startTest(){mode="test";quiz=balancedTest();idx=0;answers=[];selected=null;checked=false;question()}
function question(){let x=quiz[idx],answered=answers.filter(Boolean).length;app.innerHTML=`
 <div class="top"><span class="pill">${mode==="test"?"Full Midterm":"Practice"}</span><span class="pill">Question ${idx+1} of ${quiz.length}</span></div>
 <div class="progress"><div style="width:${idx/quiz.length*100}%"></div></div>
 <div class="sectionTitle">${unitName(x.unit)} - ${TYPES[x.type]}</div><div class="q">${esc(x.q)}</div>
 <div class="answers">${x.opts.map((o,i)=>`<button class="option ${selected===o?"sel":""}" onclick="pick(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}</div><div id="fb"></div>
 <div class="controls">${mode==="practice"?`<button id="check" class="btn primary" onclick="checkPractice()" ${selected===null?"disabled":""}>Check Answer</button>`:`<button class="btn secondary" onclick="prev()" ${idx===0?"disabled":""}>Previous</button><button class="btn primary" onclick="nextTest()">${idx===quiz.length-1?"Review and Submit":"Next"}</button>`}<button class="btn outline" onclick="home()">Quit</button></div>
 ${mode==="test"?`<p class="small muted">${answered} of ${quiz.length} answered. You can change answers before submitting.</p>`:""}`;
 if(mode==="test"&&answers[idx]){selected=answers[idx].choice;highlightSelected()}}
function highlightSelected(){[...document.querySelectorAll(".option")].forEach((b,i)=>b.classList.toggle("sel",quiz[idx].opts[i]===selected))}
function pick(i){if(mode==="practice"&&checked)return;selected=quiz[idx].opts[i];highlightSelected();let c=document.getElementById("check");if(c)c.disabled=false;if(mode==="test")answers[idx]={choice:selected}}
function checkPractice(){if(selected===null)return;checked=true;let x=quiz[idx],ok=selected===x.a;answers[idx]={choice:selected,ok};[...document.querySelectorAll(".option")].forEach((b,i)=>{let o=x.opts[i];if(o===x.a)b.classList.add("correct");else if(o===selected)b.classList.add("wrong");b.disabled=true});document.getElementById("fb").innerHTML=`<div class="feedback ${ok?"good":"bad"}"><strong>${ok?"Correct.":"Not quite."}</strong> ${esc(x.exp)}</div>`;document.querySelector(".controls").innerHTML=`<button class="btn primary" onclick="nextPractice()">${idx===quiz.length-1?"See Results":"Next Question"}</button><button class="btn outline" onclick="home()">Quit</button>`}
function nextPractice(){if(idx===quiz.length-1)return practiceResult();idx++;selected=null;checked=false;question()}
function practiceResult(){let n=answers.filter(a=>a?.ok).length;app.innerHTML=`<div class="eyebrow">Practice Complete</div><h1>Practice Result</h1><div class="score">${Math.round(n/quiz.length*100)}%</div><p>${n} of ${quiz.length} correct.</p><p class="muted">This score is for learning and is not added to full-test history.</p><div class="controls"><button class="btn primary" onclick="practiceSetup()">Practice Again</button><button class="btn secondary" onclick="home()">Home</button></div>`}
function prev(){if(idx>0){idx--;selected=answers[idx]?.choice||null;question()}}
function nextTest(){if(selected!==null)answers[idx]={choice:selected};if(idx<quiz.length-1){idx++;selected=answers[idx]?.choice||null;question()}else reviewSubmit()}
function reviewSubmit(){let unanswered=quiz.length-answers.filter(Boolean).length;app.innerHTML=`<div class="eyebrow">Full Midterm</div><h1>Submit Your Test?</h1><p class="sub">Answers and explanations have not been shown.</p><div class="callout ${unanswered?"":"ready"}"><strong>${unanswered?`${unanswered} question${unanswered>1?"s":""} unanswered.`:"All 40 questions answered."}</strong></div><div class="controls"><button class="btn primary" onclick="submitTest()">Submit Test</button><button class="btn secondary" onclick="backToLast()">Go Back</button></div>`}
function backToLast(){idx=quiz.length-1;selected=answers[idx]?.choice||null;question()}
function submitTest(){let per={};Object.keys(UNITS).forEach(u=>per[u]={c:0,n:0});let correct=0,missed=[];quiz.forEach((x,i)=>{let choice=answers[i]?.choice||"No answer",ok=choice===x.a;per[x.unit].n++;if(ok){correct++;per[x.unit].c++}else missed.push({unit:x.unit,type:x.type,q:x.q,a:x.a,choice,exp:x.exp})});let rec={ts:new Date().toISOString(),score:correct,total:quiz.length,pct:Math.round(correct/quiz.length*100),per,missed};let h=getHist();h.push(rec);localStorage.setItem(key,JSON.stringify(h.slice(-50)));resultView(rec)}
function confidence(h=getHist()){if(h.length<2)return{ok:false,msg:`Complete ${2-h.length} more full test${h.length===1?"":"s"} to build a consistency streak.`};let pass=r=>r.pct>=85&&Object.values(r.per).every(v=>v.n&&v.c/v.n>=.75),a=h[h.length-1],b=h[h.length-2];return pass(a)&&pass(b)?{ok:true,msg:"Two consecutive tests at 85%+ with every unit at 75%+."}:{ok:false,msg:"Target: two consecutive tests at 85%+ with every unit at 75%+."}}
function resultView(r){let c=confidence();app.innerHTML=`<div class="eyebrow">Full Midterm Result</div><h1>Your Results</h1><div class="score">${r.pct}%</div><p>${r.score} of ${r.total} correct</p><div class="callout ${c.ok?"ready":""}"><strong>${c.ok?"Readiness target reached":"Keep building consistency"}</strong><br>${c.msg}</div>${Object.entries(r.per).map(([u,v])=>{let p=Math.round(v.c/v.n*100);return `<div class="mastery"><strong><span>${unitName(u)}</span><span>${v.c}/${v.n} - ${p}%</span></strong><div class="bar"><i style="width:${p}%"></i></div></div>`}).join("")}<div class="controls"><button class="btn primary" onclick="missedView()">Review Missed Questions</button><button class="btn secondary" onclick="startTest()">Take Another Test</button><button class="btn outline" onclick="home()">Home</button></div>`}
function missedView(){let h=getHist(),r=h[h.length-1];if(!r||!r.missed.length){app.innerHTML=`<h1>No Missed Questions</h1><p>Nothing to review from the latest full test.</p><button class="btn primary" onclick="home()">Home</button>`;return}app.innerHTML=`<div class="eyebrow">Self-Correction</div><h1>Review Missed Questions</h1><p class="sub">Explain the corrected idea aloud before moving on.</p>${r.missed.map(m=>`<div class="reviewItem"><div class="sectionTitle">${unitName(m.unit)} - ${TYPES[m.type]}</div><strong>${esc(m.q)}</strong><p class="small">Your answer: ${esc(m.choice)}<br>Correct answer: <strong>${esc(m.a)}</strong></p><p>${esc(m.exp)}</p></div>`).join("")}<div class="controls"><button class="btn primary" onclick="weakPractice()">Practice Weak Areas</button><button class="btn secondary" onclick="home()">Home</button></div>`}
function weakPractice(){let h=getHist();if(!h.length){practiceSetup();return}let misses={};Object.keys(UNITS).forEach(u=>misses[u]=0);h.slice(-5).forEach(r=>r.missed.forEach(m=>misses[m.unit]++));let u=Object.keys(misses).sort((a,b)=>misses[b]-misses[a])[0];if(!misses[u]){practiceSetup();return}startPractice(u)}
function historyView(){let h=getHist(),c=confidence(h);app.innerHTML=`<div class="eyebrow">Progress</div><h1>Results and Readiness</h1><p class="sub">Only completed 40-question midterms appear here.</p><div class="callout ${c.ok?"ready":""}"><strong>${c.ok?"Readiness target reached":"Readiness target"}</strong><br>${c.msg}</div>${h.length?`<table class="history"><thead><tr><th>Test</th><th>Date</th><th>Score</th></tr></thead><tbody>${h.slice().reverse().map((r,i)=>`<tr><td>#${h.length-i}</td><td>${new Date(r.ts).toLocaleString()}</td><td><strong>${r.pct}%</strong> (${r.score}/${r.total})</td></tr>`).join("")}</tbody></table>`:`<p>No full midterms completed yet.</p>`}<div class="controls"><button class="btn primary" onclick="startTest()">Take Full Midterm</button><button class="btn secondary" onclick="home()">Home</button>${h.length?`<button class="btn outline" onclick="exportResults()">Export Results</button><button class="btn outline danger" onclick="clearResults()">Clear Results</button>`:""}</div>`}
function exportResults(){let blob=new Blob([JSON.stringify(getHist(),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="gibbons_biology_midterm_2026_results.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function clearResults(){if(confirm("Clear all saved midterm results on this browser?")){localStorage.removeItem(key);historyView()}}
function freeResponseView(){app.innerHTML=`<div class="eyebrow">Written Practice</div><h1>Free-Response Workshop</h1><p class="sub">Plan with the checklist, then write the answer in your own words without copying model wording.</p><div class="callout"><strong>Best method:</strong> answer from memory first. Use the checklist only after you finish, then revise missing science ideas.</div>${FR.map((x,i)=>`<div class="fr"><div class="sectionTitle">Prompt ${i+1} - ${x[0]}</div><h3>${x[1]}</h3><div class="rubric"><strong>Full-credit checklist</strong><p>${x[2]}</p></div></div>`).join("")}<div class="controls"><button class="btn primary" onclick="startApplication()">Practice Application Questions</button><button class="btn secondary" onclick="home()">Home</button></div>`}

fetch("biology-unit1.html").then(r=>r.text()).then(t=>{let m=t.match(/const LOGO="([^"]+)"/);if(m)document.getElementById("gibbonsLogo").src=m[1]}).catch(()=>{});
home();
</script>
</body>
</html>
