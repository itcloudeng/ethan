const TYPES={recall:"Knowledge",apply:"Application",data:"Graph / Data"};
const REVIEWS={
u1:{
 intro:"Biology studies living systems and uses controlled evidence to test explanations. Use the examples below to identify ideas in unfamiliar scenarios, not just memorize definitions.",
 blocks:[
  ["Characteristics of Life",["Cellular organization: every organism contains one or more cells, the basic units of life.","Energy use: organisms obtain and transform energy for transport, growth, repair, and other cellular work.","Homeostasis: internal conditions stay within workable ranges even when the environment changes.","Growth and development follow inherited instructions; reproduction produces new organisms; heredity passes DNA to offspring.","Response to stimuli means detecting and reacting to change. Populations also evolve across generations.","One event can show several characteristics. A lizard moving into shade responds to heat and helps maintain homeostasis."]],
  ["From Question to Conclusion",["Start with an observation and a testable question, then research what is already known.","A hypothesis is a testable explanation. A useful format is: If the independent variable changes, then the dependent variable will change in a predicted direction because of a biological reason.","Design a controlled experiment, collect organized data, analyze patterns, and decide whether the evidence supports the hypothesis.","A hypothesis is supported or not supported; one experiment does not prove it permanently.","Communicate results so other scientists can repeat the work. Replication helps reveal chance results and design problems."]],
  ["Variables and Groups",["Independent variable (IV): the one factor deliberately changed by the investigator.","Dependent variable (DV): the response that is measured. Example: if fertilizer amount changes and height is measured, fertilizer is the IV and height is the DV.","Constants: all other conditions kept the same, such as species, starting age, soil, water, light, pot size, and time.","Experimental group: receives the tested treatment. Control group: provides a baseline without the tested treatment or with a standard condition.","Repeated trials and adequate sample size reduce the influence of chance variation. They do not repair a poorly controlled experiment."]],
  ["Data and Graphs",["Quantitative data use numbers and units, such as 4.2 cm or 18 bubbles per minute. Qualitative data describe qualities, such as color, shape, or behavior.","Use a line graph for continuous change, especially over time. Use a bar graph to compare separate categories or groups.","Place the independent variable on the X-axis and the dependent variable on the Y-axis. Label both axes with units and use an even scale.","A descriptive title can follow: The Effect of [IV] on [DV]. A legend is needed when more than one data set appears.","Read only what the data support. If groups average 8, 12, and 10 cm, the second group grew most; those values alone do not prove why.","A conclusion cites the pattern or measurements, states whether they support the hypothesis, and identifies limitations or useful next tests."]],
  ["Common Experimental Mistakes",["Changing more than one major condition makes it difficult to identify the cause of a result.","A missing control removes the baseline for comparison.","Unequal measurement times, small samples, or inconsistent procedures reduce reliability.","Do not confuse the variable changed with the variable measured, and do not claim causation from unrelated observations alone."]]
 ]
},
u2:{
 intro:"Chemical structure explains how water, biological molecules, indicators, and enzymes behave. Every food-test and enzyme question can be answered from this section.",
 blocks:[
  ["Atoms, Bonds, and Water",["Protons are positive and neutrons are neutral in the nucleus; electrons are negative and occupy the electron cloud. Proton number identifies the element.","Covalent bonds share electrons within a molecule. Polar covalent bonds share unequally and create partial charges.","Hydrogen bonds are weaker attractions between partial charges on nearby polar molecules, including neighboring water molecules.","Water is polar: oxygen is partially negative and the hydrogens are partially positive.","A solution below pH 7 is acidic, pH 7 is neutral, and above pH 7 is basic. Large pH changes can disrupt protein shape."]],
  ["Why Water Matters",["Cohesion is water attracting water; it produces surface tension and helps droplets hold together.","Adhesion is water attracting another polar surface; together with cohesion it supports capillary action.","High specific heat lets water absorb substantial energy before its temperature changes greatly, helping stabilize organisms and environments.","Water dissolves many ionic and polar substances because its partial charges surround charged or polar particles.","Ice is less dense than liquid water, so it floats and can insulate water below."]],
  ["Four Biomolecules",["Carbohydrates contain carbon, hydrogen, and oxygen, often near a 1:2:1 ratio. Monosaccharides build larger carbohydrates. Roles include fast energy, short-term storage, and plant structure; examples include glucose, starch, glycogen, and cellulose.","Lipids are largely nonpolar and include fats, oils, phospholipids, and steroids. Glycerol and fatty acids build many lipids. Roles include long-term energy, insulation, membranes, and some hormones.","Proteins are chains of amino acids joined by peptide bonds. Their shapes allow roles in enzymes, structure, transport, signaling, defense, and movement.","Nucleic acids are polymers of nucleotides. Each nucleotide has a sugar, phosphate, and nitrogenous base. DNA and RNA store or use genetic information.","Structure predicts function: phospholipids form membranes, enzymes need a specific three-dimensional shape, and nucleotide sequence stores information."]],
  ["Food Indicator Tests",["Iodine tests for starch. A positive result changes from amber/brown to blue-black or dark purple.","Benedict's solution tests for simple reducing sugars and must be heated. A positive result changes from blue toward green, yellow, orange, or brick red as sugar concentration increases.","Biuret solution tests for protein. A positive result changes from blue to lilac or purple.","The brown-paper test indicates lipid when a dry sample leaves a persistent translucent spot.","Controls make tests interpretable: a known positive shows the reagent works, and a known negative shows the unchanged color."]],
  ["Enzyme Action",["Enzymes are biological catalysts, usually proteins. They lower activation energy, speed reactions, and are not consumed.","A substrate binds to a specifically shaped active site. The enzyme-substrate interaction depends on both shape and chemical properties.","Products leave the active site, allowing the enzyme to be reused. An enzyme changes reaction rate, not the identity or final amount of possible products.","Increasing substrate concentration raises rate only until active sites are working near capacity. Increasing enzyme concentration can raise rate when substrate is available."]],
  ["Temperature, pH, and Data",["Below an enzyme's optimum temperature, added heat often increases molecular collisions and reaction rate.","Above the optimum, heat can disrupt the interactions maintaining protein shape. Denaturation changes the active site and sharply lowers activity.","Each enzyme has a suitable pH range. Strongly acidic or basic conditions can change charges, folding, and substrate binding.","The optimum among tested conditions is the condition with the greatest measured activity. If catalase makes 18 mL at 20 C, 34 mL at 35 C, and 9 mL at 60 C, the measured optimum is 35 C.","Do not conclude that an enzyme works only at its optimum or that all enzymes share the same optimum."]]
 ]
},
u3:{
 intro:"Cells divide labor among specialized structures and regulate movement across a selectively permeable phospholipid membrane.",
 blocks:[
  ["Prokaryotic and Eukaryotic Cells",["All cells have a plasma membrane, cytoplasm, DNA, and ribosomes.","Prokaryotes are generally smaller and lack a nucleus and membrane-bound organelles. Their DNA is in a nucleoid region; bacteria and archaea are prokaryotes.","Eukaryotes have a nucleus and membrane-bound organelles. Animals, plants, fungi, and protists are eukaryotic.","Plant cells have a cellulose cell wall, chloroplasts, and a large central vacuole. Animal cells lack those three structures.","Both plant and animal cells have a nucleus, mitochondria, ribosomes, ER, Golgi, cytoplasm, and a plasma membrane."]],
  ["Organelle Function Map",["Nucleus: stores DNA and controls gene expression. Nucleolus: assembles ribosome components. Ribosomes: build proteins.","Rough ER: folds and transports proteins made by attached ribosomes. Smooth ER: makes lipids and helps detoxify.","Golgi apparatus: modifies, sorts, and packages proteins or lipids into vesicles.","Mitochondria: aerobic respiration and ATP production. Cells with high energy demand often contain many mitochondria.","Chloroplasts: photosynthesis in plants and algae. Lysosomes: digestion and recycling. Vacuoles: storage; the central vacuole also supports plant cells.","A secreted protein follows ribosome -> rough ER -> Golgi -> transport vesicle -> plasma membrane -> exocytosis."]],
  ["Plasma Membrane Structure",["The membrane is a phospholipid bilayer. Hydrophilic phosphate heads face watery environments; hydrophobic fatty-acid tails face inward.","Small nonpolar molecules such as O2 and CO2 cross the bilayer more easily than ions or large polar molecules.","Channel and carrier proteins provide selective pathways. Receptors receive signals, carbohydrate chains help cell recognition, and cholesterol helps membrane stability.","Selectively permeable means some substances cross more easily than others; it does not mean the membrane blocks everything."]],
  ["Passive and Active Transport",["Simple diffusion moves small molecules directly from high to low concentration and requires no ATP.","Facilitated diffusion also moves high to low without ATP, but it uses a channel or carrier protein.","Osmosis is the net diffusion of water across a selectively permeable membrane toward the side with higher solute concentration.","Active transport uses energy and membrane proteins to move substances, often from low to high concentration.","Endocytosis uses vesicles to bring large material into a cell. Exocytosis fuses vesicles with the membrane to release material. Both require energy."]],
  ["Tonicity Predictions",["Hypotonic solution: lower solute outside the cell, so net water enters. Animal cells swell and may lyse; plant cells become firm or turgid.","Isotonic solution: equal effective solute concentration, so water moves both ways with no net change. Animal cells remain normal; plant cells are often flaccid.","Hypertonic solution: higher solute outside the cell, so net water exits. Animal cells shrivel; plant membranes pull from the wall, called plasmolysis.","Always compare the solution with the cell. A 20% solute cell placed in 30% solute solution loses water; in 10% solution it gains water; in 20% solution there is no net movement."]],
  ["Common Transport Mistakes",["Diffusion and facilitated diffusion do not use ATP, even though facilitated diffusion uses a protein.","Water moves toward higher solute concentration, not because the solute itself pulls with intention but because of random molecular movement and unequal water concentration.","A plant cell does not usually burst in a hypotonic solution because its rigid wall resists expansion."]]
 ]
},
u4:{
 intro:"Photosynthesis stores light energy in sugar, while cellular respiration transfers sugar's chemical energy to ATP. Track location, inputs, outputs, matter, and energy for every stage.",
 blocks:[
  ["ATP and Energy Coupling",["ATP contains adenine, ribose, and three phosphate groups. ADP has two phosphates.","Breaking the bond to the terminal phosphate transfers usable energy: ATP -> ADP + phosphate + energy for cell work.","Energy from respiration rebuilds ATP from ADP and phosphate. ATP is a short-term energy carrier, not long-term energy storage like fat."]],
  ["Overall Matter and Energy",["Photosynthesis: 6 CO2 + 6 H2O + light -> C6H12O6 + 6 O2. It stores light energy in glucose.","Aerobic respiration: C6H12O6 + 6 O2 -> 6 CO2 + 6 H2O + ATP. It transfers chemical energy from glucose to ATP.","The overall matter equations are largely reverse: products of one can serve as reactants of the other.","Matter cycles, but energy does not. Energy enters as light, becomes chemical energy, powers cellular work through ATP, and eventually leaves as heat."]],
  ["Photosynthesis Stages",["Photosynthesis occurs in chloroplasts. Chlorophyll and electron carriers capture light energy.","Light-dependent reactions occur in thylakoid membranes. Inputs: light, water, ADP, and NADP+. Outputs: O2, ATP, and NADPH.","The released oxygen comes from water split during the light reactions, not from CO2.","The Calvin cycle occurs in the stroma. Inputs: CO2, ATP, and NADPH. Output: G3P, which can be used to build glucose and other organic molecules.","Without CO2, the Calvin cycle cannot add carbon to build sugar even if light reactions can continue briefly."]],
  ["Cellular Respiration Stages",["Glycolysis occurs in cytoplasm. One glucose becomes 2 pyruvate, net 2 ATP, and NADH. Glycolysis itself does not require oxygen.","Pyruvate oxidation and the Krebs cycle occur in the mitochondrial matrix. Carbon leaves as CO2, a small amount of ATP forms, and NADH/FADH2 carry high-energy electrons.","The electron transport chain is in the inner mitochondrial membrane. Electron energy pumps hydrogen ions and their flow through ATP synthase makes most ATP.","Oxygen is the final electron acceptor and combines with electrons and hydrogen ions to form water. Without oxygen, the chain backs up and aerobic ATP production falls sharply."]],
  ["Aerobic vs. Fermentation",["Aerobic respiration uses oxygen and produces far more ATP per glucose than glycolysis alone.","Fermentation occurs in cytoplasm after glycolysis and adds no extra ATP beyond glycolysis's net 2 ATP.","Its essential job is to oxidize NADH back to NAD+, allowing glycolysis to continue when oxygen is unavailable.","Lactic acid fermentation occurs in some bacteria and muscle cells under limited oxygen. Alcoholic fermentation in yeast produces ethanol and CO2; the CO2 helps bread rise."]],
  ["Common Energy Mistakes",["Plants perform both photosynthesis and cellular respiration; respiration is not limited to animals.","The Calvin cycle does not directly require light, but it depends on ATP and NADPH made by the light reactions.","Fermentation does not make more ATP than aerobic respiration and does not create oxygen."]]
 ]
},
u5:{
 intro:"DNA stores sequence information, replication copies it, and gene expression uses RNA to build proteins. Follow base-pair rules carefully at each step.",
 blocks:[
  ["Nucleotides, DNA, and RNA",["Every nucleotide has a phosphate group, five-carbon sugar, and nitrogenous base. Phosphate and sugar form the backbone; base sequence carries information.","DNA uses deoxyribose and bases A, T, C, and G. It is usually a double-stranded helix and provides long-term information storage.","RNA uses ribose and bases A, U, C, and G. It is usually single-stranded and carries out roles in gene expression.","DNA pairing: A-T and C-G. RNA pairing during transcription: DNA A pairs with RNA U, DNA T with RNA A, and C with G."]],
  ["DNA Organization and Replication",["A gene is a DNA segment containing instructions for a functional product. DNA wrapped around proteins forms chromatin, which condenses into chromosomes during cell division.","Before cell division, the two DNA strands separate. Each original strand acts as a template for a complementary strand.","DNA polymerase adds complementary DNA nucleotides using A-T and C-G pairing.","Replication is semiconservative because each daughter DNA molecule contains one original strand and one newly synthesized strand.","Example: a DNA template C G T A produces the complementary DNA sequence G C A T."]],
  ["Transcription",["Transcription copies the information in one DNA strand into mRNA, generally in the nucleus of a eukaryotic cell.","RNA polymerase reads the DNA template and builds complementary RNA using A-U and C-G pairing.","Example: DNA template T A C G G A A A T becomes mRNA A U G C C U U U A.","The mRNA leaves the nucleus and carries codons to a ribosome. A codon is a group of three mRNA bases."]],
  ["Translation and RNA Roles",["Translation occurs at a ribosome in cytoplasm or on rough ER. The ribosome reads mRNA codons in order.","mRNA carries the coded message. tRNA carries a specific amino acid and uses its anticodon to pair with an mRNA codon. rRNA forms much of the ribosome and helps catalyze peptide-bond formation.","A start codon begins translation in the correct reading frame. A stop codon ends translation and does not code for an amino acid.","Amino acids join into a polypeptide, which folds into a functional protein.","A secreted protein follows DNA -> mRNA -> ribosome on rough ER -> Golgi -> vesicle -> exocytosis."]],
  ["Mutation to Cell Function",["A substitution changes one base. It may be silent if the new codon specifies the same amino acid, missense if it changes an amino acid, or nonsense if it creates a stop codon.","A premature stop codon can produce a shortened protein. An amino-acid change can alter folding, active-site shape, stability, or interactions.","The effect may be small or absent if the codon still specifies the same amino acid, the change occurs outside a critical region, or the new amino acid has similar properties.","Insertions and deletions can shift the reading frame when the number of added or removed bases is not a multiple of three, changing many downstream codons.","Trace cause and effect: DNA change -> mRNA codon change -> possible amino-acid change -> protein-shape change -> altered cell function."]],
  ["Common Gene-Expression Mistakes",["Transcription makes RNA from DNA; translation makes protein from mRNA. Translation does not happen in the nucleus.","Codons are on mRNA; anticodons are on tRNA.","RNA uses uracil instead of thymine. During replication, DNA still uses thymine."]]
 ]
}
};

["u1","recall","Which variable is deliberately changed by the investigator?","independent variable",["dependent variable","constant","control group"],"The independent variable is the one factor the investigator changes."],
["u1","recall","Which variable is measured as the response in an experiment?","dependent variable",["independent variable","constant","experimental treatment"],"The dependent variable is the measured outcome."],
["u1","apply","A student changes fertilizer amount and records plant height after 14 days. What is the dependent variable?","plant height after 14 days",["fertilizer amount","plant species","amount of soil"],"Plant height is the measured response."],
["u1","apply","Why does a well-designed experiment include a control group?","It provides a baseline for comparison.",["It guarantees the hypothesis is correct.","It changes every variable at once.","It removes the need for repeated trials."],"A control provides a baseline that helps isolate the effect of the independent variable."],
["u1","recall","Which is quantitative data?","The plant grew 4.2 cm.",["The leaf was dark green.","The solution smelled sweet.","The cells looked round."],"Quantitative data are expressed with numbers and units."],
["u1","recall","Which graph is usually best for showing plant height measured each week?","line graph",["bar graph","circle diagram","classification key"],"A line graph shows continuous change over time."],
["u1","data","On a graph testing light intensity's effect on photosynthesis rate, what belongs on the X-axis?","light intensity",["photosynthesis rate","the conclusion","the control group's final value only"],"The independent variable belongs on the X-axis."],

["u1","apply","Which hypothesis is most testable?","If light intensity increases within a usable range, then photosynthesis rate will increase because more light energy is available.",["Plants like light.","Photosynthesis is interesting.","Light might do something to plants."],"A testable hypothesis identifies variables, predicts a direction, and gives a reason."],
["u1","data","Repeated trials give 18, 19, 18, and 20 bubbles per minute. Why are repeats useful?","They reduce the effect of chance variation.",["They change the independent variable.","They eliminate the need for constants.","They guarantee a perfect conclusion."],"Repeated trials make results more reliable by reducing the influence of chance."],

["u2","apply","Water beads on a waxy surface mainly because water molecules attract one another. This property is:","cohesion",["adhesion","denaturation","hydrolysis"],"Cohesion is attraction between molecules of the same substance."],
["u2","recall","The monomers of proteins are:","amino acids",["nucleotides","monosaccharides","fatty acids only"],"Proteins are polymers built from amino acids."],

["u2","apply","Iodine turns a potato sample blue-black. What does this indicate?","starch is present",["protein is present","lipid is absent","the sample is strongly basic"],"A blue-black iodine result is positive for starch, a carbohydrate."],

["u2","data","Catalase produces 18 mL at 20 C, 34 mL at 35 C, and 9 mL at 60 C. What is the optimum among the tested temperatures?","35 C",["20 C","60 C","It cannot be estimated from these data."],"The greatest measured activity occurs at 35 C."],
["u2","data","Why might enzyme activity drop sharply above its optimum temperature?","The enzyme may denature and its active site may change shape.",["The enzyme gains more substrate.","All molecules stop moving.","The products become reactants."],"High temperature can disrupt the interactions that maintain enzyme shape."],
["u2","recall","Which biomolecule is a major component of cell membranes?","phospholipid",["starch","DNA","glycogen only"],"Phospholipids form the membrane bilayer."],
["u2","apply","Which food-test result indicates protein?","Biuret changes to lilac or purple.",["Iodine becomes blue-black.","Brown paper remains translucent.","Benedict's remains blue after heating."],"A purple Biuret result is positive for protein."],

// Unit 3
["u3","recall","Which structures are found in prokaryotic and eukaryotic cells?","plasma membrane, cytoplasm, DNA, and ribosomes",["nucleus, Golgi, and mitochondria","chloroplasts and a central vacuole","rough ER and lysosomes"],"All cells share a membrane, cytoplasm, genetic material, and ribosomes."],
["u3","recall","Which structure directly builds proteins?","ribosome",["lysosome","vacuole","cell wall"],"Ribosomes assemble amino acids into proteins."],
["u3","apply","A gland cell secretes large amounts of protein hormone. Which pathway should be especially active?","ribosome -> rough ER -> Golgi -> vesicle",["nucleus -> lysosome -> chloroplast","Golgi -> DNA -> ribosome","mitochondrion -> cell wall -> nucleus"],"Secreted proteins are built on ribosomes, processed in rough ER and Golgi, then carried in vesicles."],
["u3","apply","A cell with many mitochondria is most likely specialized for:","high ATP demand",["DNA storage","water storage","cell wall production"],"Mitochondria transfer energy from food to ATP."],

["u4","recall","The oxygen released during photosynthesis comes from:","water split during the light-dependent reactions",["carbon dioxide split during glycolysis","glucose split in the Calvin cycle","ATP broken in mitochondria"],"Water is split in the light-dependent reactions, releasing O2."],

["u4","recall","Where does glycolysis occur?","cytoplasm",["chloroplast stroma","mitochondrial matrix only","nucleus"],"Glycolysis occurs in the cytoplasm."],

["u5","recall","Transcription produces:","mRNA from a DNA template",["DNA from protein","protein directly from DNA","ATP from glucose"],"RNA polymerase uses DNA as a template to build RNA."],
["u5","recall","During translation, the anticodon is found on:","tRNA",["DNA","mRNA","the cell membrane"],"A tRNA anticodon pairs with an mRNA codon."],
["u5","apply","A DNA template sequence T A C G G A A A T is transcribed into:","A U G C C U U U A",["A T G C C T T T A","U A C G G A A A U","T A C G G A A A T"],"During transcription, RNA bases pair with the DNA template using A-U and C-G."],
["u5","apply","Which sequence correctly traces a secreted protein?","DNA -> mRNA -> ribosome/rough ER -> Golgi -> vesicle",["nucleus -> lysosome -> chloroplast","Golgi -> DNA -> ribosome","mitochondrion -> nucleus -> membrane"],"Gene information is transcribed, translated, processed, packaged, and exported."],
["u5","apply","A base substitution changes an mRNA codon but not the amino acid. The mutation is:","silent",["certain to destroy the protein","a deletion","a chromosome duplication"],"Because more than one codon can specify the same amino acid, some substitutions are silent."],

["u5","data","A mutation creates a stop codon near the beginning of a gene. What is the most likely result?","A shortened protein is produced.",["A longer chromosome forms.","Translation never begins for any gene.","The protein automatically gains ATP."],"A premature stop codon ends translation early."],

const FR=[
 ["Experimental Design","Design an experiment testing how temperature affects catalase activity.","Include a directional hypothesis, independent and dependent variables, a control or baseline, at least two constants, repeated trials, and the quantitative data you would collect."],
 ["Osmosis and Tonicity","A freshwater organism is moved into saltwater. Predict what happens to its cells and explain why.","Identify saltwater as hypertonic relative to the cells, state that water moves out by osmosis toward higher solute concentration, and connect water loss to cell shrinkage and disrupted function."],
 ["Matter and Energy","Compare how a leaf cell uses chloroplasts and mitochondria during a sunny day.","Explain the inputs and outputs of both processes. Distinguish matter cycling from energy flow from light to chemical energy, ATP, and heat."],
 ["Gene to Trait","A mutation changes one DNA base in a gene. Trace how it could affect cell function.","Connect DNA to mRNA, codons, amino-acid sequence, protein folding or active-site shape, and function. Explain why a substitution might be silent or occur outside a critical region."]
];

let mode="",quiz=[],idx=0,answers=[],selected=null,checked=false,currentUnit="all";
const app=document.getElementById("app"),key="gibbonsBioMidterm2026ResultsV1";
function sh(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function makeItem(x){return {unit:x[0],type:x[1],q:x[2],a:x[3],exp:x[5],opts:sh([x[3],...x[4]])}}
function getHist(){try{return JSON.parse(localStorage.getItem(key)||"[]")}catch(e){return[]}}
function bank(unit="all",type="all"){return Q.filter(x=>(unit==="all"||x[0]===unit)&&(type==="all"||x[1]===type))}
function balancedTest(){let out=[];Object.keys(UNITS).forEach(u=>{let recall=sh(Q.filter(x=>x[0]===u&&x[1]==="recall")).slice(0,4),reasoning=sh(Q.filter(x=>x[0]===u&&x[1]!=="recall")).slice(0,4);out.push(...[...recall,...reasoning].map(makeItem))});return sh(out)}
function unitName(u){return `${UNITS[u].name}: ${UNITS[u].title}`}
function home(){mode="";app.innerHTML=`
 <div class="eyebrow">Gibbons Honors Biology</div><h1>Midterm Study Center</h1>
 <div class="unitGrid">${Object.entries(UNITS).map(([u,v])=>`<button class="unitChip" onclick="reviewView('${u}')">${v.name}<small>${v.short}</small></button>`).join("")}</div>
 <div class="grid">
  <button class="choice" onclick="reviewView('all')"><h3>Concept Review</h3><p>Concise guides for every midterm unit.</p></button>
  <button class="choice" onclick="practiceSetup()"><h3>Targeted Practice</h3><p>Choose a unit and question style with immediate feedback.</p></button>
  <button class="choice" onclick="startApplication()"><h3>Application + Data</h3><p>Mixed scenarios, predictions, and graph/data reasoning.</p></button>
  <button class="choice" onclick="freeResponseView()"><h3>Free-Response Workshop</h3><p>Four prompts with checklists for planning answers in your own words.</p></button>
  <button class="choice" onclick="startTest()"><h3>40-Question Midterm</h3><p>Eight questions per unit. No feedback until submission.</p></button>
  <button class="choice" onclick="weakPractice()"><h3>Practice Weak Areas</h3><p>Targets the unit missed most often on recent full tests.</p></button>
  <button class="choice wide" onclick="historyView()"><h3>Results and Readiness</h3><p>Track full-test scores, unit performance, and consistency on this browser.</p></button>
 </div>
 <div class="callout"><strong>Readiness target:</strong> two consecutive full tests at 85% or higher, with every unit at 75% or higher.</div>
 `}

function reviewView(unit="all"){
 let units=unit==="all"?Object.keys(UNITS):[unit];
 app.innerHTML=`<div class="eyebrow">Concept Review</div><h1>${unit==="all"?"Midterm Review":UNITS[unit].name+" Review"}</h1><p class="sub">Read for structure, then close this page and explain each idea from memory.</p>
 ${units.map(u=>`<section><h2>${unitName(u)}</h2><p>${REVIEWS[u].intro}</p>${REVIEWS[u].blocks.map(b=>`<div class="reviewCard"><h3>${b[0]}</h3><ul>${b[1].map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}<div class="controls"><button class="btn primary" onclick="startPractice('${u}')">Practice ${UNITS[u].name}</button></div></section>`).join("")}
 <div class="controls"><button class="btn secondary" onclick="home()">Home</button></div>`
}

function practiceSetup(){app.innerHTML=`<div class="eyebrow">Targeted Practice</div><h1>Choose Your Focus</h1><p class="sub">Practice shows feedback after every answer and does not affect full-test history.</p>
 <div class="row"><select id="unit"><option value="all">All Units</option>${Object.entries(UNITS).map(([u,v])=>`<option value="${u}">${v.name}: ${v.short}</option>`).join("")}</select>
 <select id="type"><option value="all">All Question Styles</option>${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select>
 <select id="cnt"><option>10</option><option selected>15</option><option>20</option><option>25</option></select></div>
 <div class="controls"><button class="btn primary" onclick="startPractice()">Start Practice</button><button class="btn secondary" onclick="home()">Back</button></div>`}

function startPractice(unitOverride=null,typeOverride=null){
 mode="practice";currentUnit=unitOverride||document.getElementById("unit")?.value||"all";let type=typeOverride||document.getElementById("type")?.value||"all";let b=bank(currentUnit,type),n=unitOverride?Math.min(12,b.length):Math.min(+(document.getElementById("cnt")?.value||15),b.length);
 if(!b.length){practiceSetup();return}quiz=sh(b).slice(0,n).map(makeItem);idx=0;answers=[];selected=null;checked=false;question()
}
function startApplication(){mode="practice";currentUnit="all";quiz=sh(Q.filter(x=>x[1]!=="recall")).slice(0,20).map(makeItem);idx=0;answers=[];selected=null;checked=false;question()}
function startTest(){mode="test";quiz=balancedTest();idx=0;answers=[];selected=null;checked=false;question()}
function question(){let x=quiz[idx],answered=answers.filter(Boolean).length;app.innerHTML=`
 <div class="top"><span class="pill">${mode==="test"?"Full Midterm":"Practice"}</span><span class="pill">Question ${idx+1} of ${quiz.length}</span></div>
 <div class="progress"><div style="width:${idx/quiz.length*100}%"></div></div>
 <div class="sectionTitle">${unitName(x.unit)} - ${TYPES[x.type]}</div><div class="q">${esc(x.q)}</div>
 <div class="answers">${x.opts.map((o,i)=>`<button class="option ${selected===o?"sel":""}" onclick="pick(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}</div><div id="fb"></div>
 <div class="controls">${mode==="practice"?`<button id="check" class="btn primary" onclick="checkPractice()" ${selected===null?"disabled":""}>Check Answer</button>`:`<button class="btn secondary" onclick="prev()" ${idx===0?"disabled":""}>Previous</button><button class="btn primary" onclick="nextTest()">${idx===quiz.length-1?"Review and Submit":"Next"}</button>`}<button class="btn outline" onclick="home()">Quit</button></div>
 ${mode==="test"?`<p class="small muted">${answered} of ${quiz.length} answered. You can change answers before submitting.</p>`:""}`;
 if(mode==="test"&&answers[idx]){selected=answers[idx].choice;highlightSelected()}}
function highlightSelected(){[...document.querySelectorAll(".option")].forEach((b,i)=>b.classList.toggle("sel",quiz[idx].opts[i]===selected))}
function pick(i){if(mode==="practice"&&checked)return;selected=quiz[idx].opts[i];highlightSelected();let c=document.getElementById("check");if(c)c.disabled=false;if(mode==="test")answers[idx]={choice:selected}}
function checkPractice(){if(selected===null)return;checked=true;let x=quiz[idx],ok=selected===x.a;answers[idx]={choice:selected,ok};[...document.querySelectorAll(".option")].forEach((b,i)=>{let o=x.opts[i];if(o===x.a)b.classList.add("correct");else if(o===selected)b.classList.add("wrong");b.disabled=true});document.getElementById("fb").innerHTML=`<div class="feedback ${ok?"good":"bad"}"><strong>${ok?"Correct.":"Not quite."}</strong> ${esc(x.exp)}</div>`;document.querySelector(".controls").innerHTML=`<button class="btn primary" onclick="nextPractice()">${idx===quiz.length-1?"See Results":"Next Question"}</button><button class="btn outline" onclick="home()">Quit</button>`}
function nextPractice(){if(idx===quiz.length-1)return practiceResult();idx++;selected=null;checked=false;question()}
function practiceResult(){let n=answers.filter(a=>a?.ok).length;app.innerHTML=`<div class="eyebrow">Practice Complete</div><h1>Practice Result</h1><div class="score">${Math.round(n/quiz.length*100)}%</div><p>${n} of ${quiz.length} correct.</p><p class="muted">This score is for learning and is not added to full-test history.</p><div class="controls"><button class="btn primary" onclick="practiceSetup()">Practice Again</button><button class="btn secondary" onclick="home()">Home</button></div>`}
function prev(){if(idx>0){idx--;selected=answers[idx]?.choice||null;question()}}
function nextTest(){if(selected!==null)answers[idx]={choice:selected};if(idx<quiz.length-1){idx++;selected=answers[idx]?.choice||null;question()}else reviewSubmit()}
function reviewSubmit(){let unanswered=quiz.length-answers.filter(Boolean).length;app.innerHTML=`<div class="eyebrow">Full Midterm</div><h1>Submit Your Test?</h1><p class="sub">Answers and explanations have not been shown.</p><div class="callout ${unanswered?"":"ready"}"><strong>${unanswered?`${unanswered} question${unanswered>1?"s":""} unanswered.`:"All 40 questions answered."}</strong></div><div class="controls"><button class="btn primary" onclick="submitTest()">Submit Test</button><button class="btn secondary" onclick="backToLast()">Go Back</button></div>`}
function backToLast(){idx=quiz.length-1;selected=answers[idx]?.choice||null;question()}
function submitTest(){let per={};Object.keys(UNITS).forEach(u=>per[u]={c:0,n:0});let correct=0,missed=[];quiz.forEach((x,i)=>{let choice=answers[i]?.choice||"No answer",ok=choice===x.a;per[x.unit].n++;if(ok){correct++;per[x.unit].c++}else missed.push({unit:x.unit,type:x.type,q:x.q,a:x.a,choice,exp:x.exp})});let rec={ts:new Date().toISOString(),score:correct,total:quiz.length,pct:Math.round(correct/quiz.length*100),per,missed};let h=getHist();h.push(rec);localStorage.setItem(key,JSON.stringify(h.slice(-50)));resultView(rec)}
function confidence(h=getHist()){if(h.length<2)return{ok:false,msg:`Complete ${2-h.length} more full test${h.length===1?"":"s"} to build a consistency streak.`};let pass=r=>r.pct>=85&&Object.values(r.per).every(v=>v.n&&v.c/v.n>=.75),a=h[h.length-1],b=h[h.length-2];return pass(a)&&pass(b)?{ok:true,msg:"Two consecutive tests at 85%+ with every unit at 75%+."}:{ok:false,msg:"Target: two consecutive tests at 85%+ with every unit at 75%+."}}
function resultView(r){let c=confidence();app.innerHTML=`<div class="eyebrow">Full Midterm Result</div><h1>Your Results</h1><div class="score">${r.pct}%</div><p>${r.score} of ${r.total} correct</p><div class="callout ${c.ok?"ready":""}"><strong>${c.ok?"Readiness target reached":"Keep building consistency"}</strong><br>${c.msg}</div>${Object.entries(r.per).map(([u,v])=>{let p=Math.round(v.c/v.n*100);return `<div class="mastery"><strong><span>${unitName(u)}</span><span>${v.c}/${v.n} - ${p}%</span></strong><div class="bar"><i style="width:${p}%"></i></div></div>`}).join("")}<div class="controls"><button class="btn primary" onclick="missedView()">Review Missed Questions</button><button class="btn secondary" onclick="startTest()">Take Another Test</button><button class="btn outline" onclick="home()">Home</button></div>`}
function missedView(){let h=getHist(),r=h[h.length-1];if(!r||!r.missed.length){app.innerHTML=`<h1>No Missed Questions</h1><p>Nothing to review from the latest full test.</p><button class="btn primary" onclick="home()">Home</button>`;return}app.innerHTML=`<div class="eyebrow">Self-Correction</div><h1>Review Missed Questions</h1><p class="sub">Explain the corrected idea aloud before moving on.</p>${r.missed.map(m=>`<div class="reviewItem"><div class="sectionTitle">${unitName(m.unit)} - ${TYPES[m.type]}</div><strong>${esc(m.q)}</strong><p class="small">Your answer: ${esc(m.choice)}<br>Correct answer: <strong>${esc(m.a)}</strong></p><p>${esc(m.exp)}</p></div>`).join("")}<div class="controls"><button class="btn primary" onclick="weakPractice()">Practice Weak Areas</button><button class="btn secondary" onclick="home()">Home</button></div>`}
function weakPractice(){let h=getHist();if(!h.length){practiceSetup();return}let misses={};Object.keys(UNITS).forEach(u=>misses[u]=0);h.slice(-5).forEach(r=>r.missed.forEach(m=>misses[m.unit]++));let u=Object.keys(misses).sort((a,b)=>misses[b]-misses[a])[0];if(!misses[u]){practiceSetup();return}startPractice(u)}
function historyView(){let h=getHist(),c=confidence(h);app.innerHTML=`<div class="eyebrow">Progress</div><h1>Results and Readiness</h1><p class="sub">Only completed 40-question midterms appear here.</p><div class="callout ${c.ok?"ready":""}"><strong>${c.ok?"Readiness target reached":"Readiness target"}</strong><br>${c.msg}</div>${h.length?`<table class="history"><thead><tr><th>Test</th><th>Date</th><th>Score</th></tr></thead><tbody>${h.slice().reverse().map((r,i)=>`<tr><td>#${h.length-i}</td><td>${new Date(r.ts).toLocaleString()}</td><td><strong>${r.pct}%</strong> (${r.score}/${r.total})</td></tr>`).join("")}</tbody></table>`:`<p>No full midterms completed yet.</p>`}<div class="controls"><button class="btn primary" onclick="startTest()">Take Full Midterm</button><button class="btn secondary" onclick="home()">Home</button>${h.length?`<button class="btn outline" onclick="exportResults()">Export Results</button><button class="btn outline danger" onclick="clearResults()">Clear Results</button>`:""}</div>`}
function exportResults(){let blob=new Blob([JSON.stringify(getHist(),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="gibbons_biology_midterm_2026_results.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function clearResults(){if(confirm("Clear all saved midterm results on this browser?")){localStorage.removeItem(key);historyView()}}
function freeResponseView(){app.innerHTML=`<div class="eyebrow">Written Practice</div><h1>Free-Response Workshop</h1><p class="sub">Plan with the checklist, then write the answer in your own words without copying model wording.</p><div class="callout"><strong>Best method:</strong> answer from memory first. Use the checklist only after you finish, then revise missing science ideas.</div>${FR.map((x,i)=>`<div class="fr"><div class="sectionTitle">Prompt ${i+1} - ${x[0]}</div><h3>${x[1]}</h3><div class="rubric"><strong>Full-credit checklist</strong><p>${x[2]}</p></div></div>`).join("")}<div class="controls"><button class="btn primary" onclick="startApplication()">Practice Application Questions</button><button class="btn secondary" onclick="home()">Home</button></div>`}

fetch("biology-unit1.html").then(r=>r.text()).then(t=>{let m=t.match(/const LOGO="([^"]+)"/);if(m)document.getElementById("gibbonsLogo").src=m[1]}).catch(()=>{});
home();
</script>
