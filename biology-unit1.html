<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gibbons 9th Grade Biology — Unit 1 Practice</title>
<style>
:root{--bg:#f5f7f6;--card:#fff;--ink:#17231c;--muted:#647067;--line:#dce5df;--green:#087f43;--green2:#e9f6ef;--gold:#e5b82e;--bad:#b42318;--badbg:#fff1f0}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.45}
.shell{width:min(880px,100%);margin:auto;padding:22px 16px 50px}.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 8px 28px rgba(18,48,31,.06)}
.logo{position:absolute;right:18px;top:16px;width:52px;height:52px;object-fit:contain;opacity:.88}
h1{font-size:clamp(1.55rem,4.5vw,2.2rem);line-height:1.15;margin:0 70px 6px 0}h2{margin:0 0 8px}.sub,.muted{color:var(--muted)}.sub{margin:0 70px 22px 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.btn,select{font:inherit}.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:750;cursor:pointer;touch-action:manipulation}.primary{background:var(--green);color:#fff}.secondary{background:#edf2ef;color:var(--ink)}.outline{background:#fff;border:1px solid var(--line)}.danger{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.choice{border:1px solid var(--line);border-radius:14px;padding:17px;background:#fff;cursor:pointer}.choice:hover{border-color:#9eb7a8}.choice h3{margin:0 0 5px;font-size:1.05rem}.choice p{margin:0;color:var(--muted);font-size:.92rem}
.top{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding-right:64px;min-height:48px}.pill{background:#eef3f0;border-radius:999px;padding:7px 11px;font-size:.88rem;font-weight:700}.progress{height:9px;background:#e8eeea;border-radius:99px;overflow:hidden;margin:14px 0 22px}.progress>div{height:100%;background:var(--green)}
.q{font-size:1.18rem;font-weight:780;margin:0 0 16px}.answers{display:grid;gap:10px}.option{width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:13px;padding:14px 15px;font-size:1rem;cursor:pointer}.option.sel{border-color:var(--green);background:var(--green2)}.option.correct{border-color:var(--green);background:var(--green2)}.option.wrong{border-color:var(--bad);background:var(--badbg)}
.feedback{margin-top:14px;padding:12px 14px;border-radius:12px;background:#f5f8f6}.feedback.good{background:var(--green2)}.feedback.bad{background:var(--badbg)}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.controls .btn{min-width:120px}
.sectionTitle{font-size:.85rem;color:var(--green);font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.score{font-size:3rem;font-weight:850;line-height:1;margin:12px 0}.mastery{padding:14px;border:1px solid var(--line);border-radius:13px;margin:10px 0}.mastery strong{display:flex;justify-content:space-between;gap:12px}.bar{height:8px;background:#e8eeea;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--green)}
.history{width:100%;border-collapse:collapse;margin-top:12px}.history th,.history td{text-align:left;border-bottom:1px solid var(--line);padding:10px 6px;font-size:.92rem}.history th{color:var(--muted)}
.callout{border-left:4px solid var(--gold);background:#fffaf0;padding:12px 14px;border-radius:8px;margin:14px 0}.ready{border-left-color:var(--green);background:var(--green2)}
select{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.small{font-size:.88rem}
.review{border-top:1px solid var(--line);padding:14px 0}.review:first-child{border-top:0}
@media(max-width:620px){body{background:#fff}.shell{padding:0}.card{min-height:100dvh;border:0;border-radius:0;box-shadow:none;padding:19px 15px 32px}.logo{width:40px;height:40px;right:12px;top:12px}.top{padding-right:52px;min-height:42px;gap:7px}.top .pill{font-size:.8rem;padding:6px 9px}h1{margin-right:58px}.sub{margin-right:55px}.grid{grid-template-columns:1fr}.option{min-height:56px}.controls{display:grid;grid-template-columns:1fr}.controls .btn{width:100%}.history th:nth-child(2),.history td:nth-child(2){display:none}}
</style>
</head>

let mode="", quiz=[], idx=0, answers=[], selected=null, checked=false, currentSection="all";
const app=document.getElementById("app");
const key="gibbonsBioUnit1ResultsV1";
function sh(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function logo(){return `<img class="logo" src="${LOGO}" alt="">`}
function bank(sec){return sec==="all"?Q:Q.filter(x=>x[0]===sec)}
function makeItem(x){let opts=sh([x[2],...x[3]]);return {sec:x[0],q:x[1],a:x[2],exp:x[4],opts}}
function balancedTest(){
 const plan={life:6,method:5,design:6,graph:5,scope:8}, out=[];
 Object.entries(plan).forEach(([s,n])=>out.push(...sh(Q.filter(x=>x[0]===s)).slice(0,n).map(makeItem)));
 return sh(out);
}
function home(){
 mode="";app.innerHTML=logo()+`
 <h1>Gibbons 9th Grade Biology</h1><p class="sub">Unit 1 practice and full tests based only on the teacher's Unit 1 packet.</p>
 <div class="grid">
  <div class="choice" onclick="practiceSetup()"><h3>Practice</h3><p>Learn by section with immediate feedback and explanations.</p></div>
  <div class="choice" onclick="startTest()"><h3>Full Test</h3><p>30 balanced questions. No feedback until you submit.</p></div>
  <div class="choice" onclick="historyView()"><h3>Results</h3><p>Track full-test scores, section performance, and consistency.</p></div>
  <div class="choice" onclick="weakPractice()"><h3>Practice Weak Areas</h3><p>Uses concepts missed on previous full tests.</p></div>
 </div>
 <div class="callout"><strong>Confidence target:</strong> two consecutive full tests at 90% or higher, with every section at 80% or higher.</div>
 <p class="small muted">Practice results do not count toward the confidence target. Full Test results are saved on this browser. Question bank checked against the Unit 1 packet and review pages.</p>`;
}
function practiceSetup(){
 app.innerHTML=logo()+`<h1>Practice</h1><p class="sub">Choose what to work on. You'll see feedback after every answer.</p>
 <div class="row"><select id="sec"><option value="all">All Unit 1 Topics</option>${Object.entries(SECTIONS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select>
 <select id="cnt"><option>10</option><option selected>15</option><option>20</option><option>30</option></select></div>
 <div class="controls"><button class="btn primary" onclick="startPractice()">Start Practice</button><button class="btn secondary" onclick="home()">Back</button></div>`;
}
function startPractice(secOverride=null){
 mode="practice"; currentSection=secOverride||document.getElementById("sec")?.value||"all";
 let n=secOverride?15:+(document.getElementById("cnt")?.value||15);
 quiz=sh(bank(currentSection)).slice(0,Math.min(n,bank(currentSection).length)).map(makeItem);idx=0;answers=[];selected=null;checked=false;question();
}
function startTest(){
 mode="test";quiz=balancedTest();idx=0;answers=[];selected=null;checked=false;question();
}
function question(){
 let x=quiz[idx], answered=answers.filter(Boolean).length;
 app.innerHTML=logo()+`
 <div class="top"><span class="pill">${mode==="test"?"Full Test":"Practice"}</span><span class="pill">Question ${idx+1} of ${quiz.length}</span></div>
 <div class="progress"><div style="width:${((idx)/quiz.length)*100}%"></div></div>
 <div class="sectionTitle">${SECTIONS[x.sec]}</div><div class="q">${esc(x.q)}</div>
 <div class="answers">${x.opts.map((o,i)=>`<button class="option ${selected===o?"sel":""}" onclick="pick(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}</div>
 <div id="fb"></div>
 <div class="controls">
 ${mode==="practice"?`<button id="check" class="btn primary" onclick="checkPractice()" ${selected===null?"disabled":""}>Check Answer</button>`:
 `<button class="btn secondary" onclick="prev()" ${idx===0?"disabled":""}>Previous</button><button class="btn primary" onclick="nextTest()">${idx===quiz.length-1?"Review & Submit":"Next"}</button>`}
 <button class="btn outline" onclick="home()">Quit</button></div>
 ${mode==="test"?`<p class="small muted">${answered} of ${quiz.length} answered. You can change answers before submitting.</p>`:""}`;
 if(mode==="test" && answers[idx]){selected=answers[idx].choice;highlightSelected()}
}
function highlightSelected(){[...document.querySelectorAll(".option")].forEach((b,i)=>b.classList.toggle("sel",quiz[idx].opts[i]===selected))}
function pick(i){if(mode==="practice"&&checked)return;selected=quiz[idx].opts[i];highlightSelected();let c=document.getElementById("check");if(c)c.disabled=false;if(mode==="test")answers[idx]={choice:selected}}
function checkPractice(){
 if(selected===null)return;checked=true;let x=quiz[idx],ok=selected===x.a;answers[idx]={choice:selected,ok};
 [...document.querySelectorAll(".option")].forEach((b,i)=>{let o=x.opts[i];if(o===x.a)b.classList.add("correct");else if(o===selected)b.classList.add("wrong");b.disabled=true});
 document.getElementById("fb").innerHTML=`<div class="feedback ${ok?"good":"bad"}"><strong>${ok?"Correct.":"Not quite."}</strong> ${esc(x.exp)}</div>`;
 document.querySelector(".controls").innerHTML=`<button class="btn primary" onclick="nextPractice()">${idx===quiz.length-1?"See Results":"Next Question"}</button><button class="btn outline" onclick="home()">Quit</button>`;
}
function nextPractice(){if(idx===quiz.length-1)return practiceResult();idx++;selected=null;checked=false;question()}
function practiceResult(){let n=answers.filter(a=>a?.ok).length;app.innerHTML=logo()+`<h1>Practice Complete</h1><div class="score">${Math.round(n/quiz.length*100)}%</div><p>${n} of ${quiz.length} correct.</p><p class="muted">Practice is for learning, so this score is not added to Full Test history.</p><div class="controls"><button class="btn primary" onclick="practiceSetup()">Practice Again</button><button class="btn secondary" onclick="home()">Home</button></div>`}
function prev(){if(idx>0){idx--;selected=answers[idx]?.choice||null;question()}}
function nextTest(){if(selected!==null)answers[idx]={choice:selected};if(idx<quiz.length-1){idx++;selected=answers[idx]?.choice||null;question()}else reviewSubmit()}
function reviewSubmit(){
 let unanswered=quiz.length-answers.filter(Boolean).length;
 app.innerHTML=logo()+`<h1>Submit Full Test?</h1><p class="sub">No answers or explanations have been shown yet.</p>
 <div class="callout ${unanswered?"":"ready"}"><strong>${unanswered?`${unanswered} question${unanswered>1?"s":""} unanswered.`:"All 30 questions answered."}</strong></div>
 <div class="controls"><button class="btn primary" onclick="submitTest()">Submit Test</button><button class="btn secondary" onclick="backToLast()">Go Back</button></div>`;
}
function backToLast(){idx=quiz.length-1;selected=answers[idx]?.choice||null;question()}
function submitTest(){
 let per={};Object.keys(SECTIONS).forEach(s=>per[s]={c:0,n:0});
 let correct=0,missed=[];
 quiz.forEach((x,i)=>{let ok=answers[i]?.choice===x.a;per[x.sec].n++;if(ok){correct++;per[x.sec].c++}else missed.push({sec:x.sec,q:x.q,a:x.a,choice:answers[i]?.choice||"No answer",exp:x.exp})});
 let pct=Math.round(correct/quiz.length*100), all80=Object.values(per).every(v=>v.c/v.n>=.8);
 let rec={ts:new Date().toISOString(),score:correct,total:quiz.length,pct,per,missed};
 let hist=getHist();hist.push(rec);localStorage.setItem(key,JSON.stringify(hist.slice(-50)));
 resultView(rec);
}
function getHist(){try{return JSON.parse(localStorage.getItem(key)||"[]")}catch(e){return[]}}
function confidence(hist=getHist()){
 if(hist.length<2)return {ok:false,msg:`Complete ${2-hist.length} more full test${hist.length===1?"":"s"} to build a consistency streak.`};
 let a=hist[hist.length-1],b=hist[hist.length-2], pass=r=>r.pct>=90&&Object.values(r.per).every(v=>v.c/v.n>=.8);
 return pass(a)&&pass(b)?{ok:true,msg:"Two consecutive full tests at 90%+ with every section at 80%+."}:{ok:false,msg:"Target: two consecutive full tests at 90%+ with every section at 80%+."};
}
function resultView(r){
 let conf=confidence();app.innerHTML=logo()+`<h1>Full Test Result</h1><div class="score">${r.pct}%</div><p>${r.score} of ${r.total} correct</p>
 <div class="callout ${conf.ok?"ready":""}"><strong>${conf.ok?"Consistent mastery demonstrated":"Keep building consistency"}</strong><br>${conf.msg}</div>
 ${Object.entries(r.per).map(([s,v])=>{let p=Math.round(v.c/v.n*100);return `<div class="mastery"><strong><span>${SECTIONS[s]}</span><span>${v.c}/${v.n} — ${p}%</span></strong><div class="bar"><i style="width:${p}%"></i></div></div>`}).join("")}
 <div class="controls"><button class="btn primary" onclick="missedView()">Review Missed Questions</button><button class="btn secondary" onclick="startTest()">Take Another Full Test</button><button class="btn outline" onclick="home()">Home</button></div>`;
}
function missedView(){
 let h=getHist(),r=h[h.length-1];if(!r||!r.missed.length){app.innerHTML=logo()+`<h1>No Missed Questions</h1><p>Nothing to review from the latest full test.</p><button class="btn primary" onclick="home()">Home</button>`;return}
 app.innerHTML=logo()+`<h1>Review Missed Questions</h1><p class="sub">Explanations use only the Unit 1 packet material.</p>${r.missed.map(m=>`<div class="review"><div class="sectionTitle">${SECTIONS[m.sec]}</div><strong>${esc(m.q)}</strong><p class="small">Your answer: ${esc(m.choice)}<br>Correct answer: <strong>${esc(m.a)}</strong></p><p>${esc(m.exp)}</p></div>`).join("")}<div class="controls"><button class="btn primary" onclick="weakPractice()">Practice Weak Areas</button><button class="btn secondary" onclick="home()">Home</button></div>`;
}
function weakPractice(){
 let h=getHist();if(!h.length){practiceSetup();return}
 let misses={};Object.keys(SECTIONS).forEach(s=>misses[s]=0);h.slice(-5).forEach(r=>r.missed.forEach(m=>misses[m.sec]++));
 let max=Math.max(...Object.values(misses));if(max===0){practiceSetup();return}
 let sec=Object.keys(misses).sort((a,b)=>misses[b]-misses[a])[0];startPractice(sec);
}
function historyView(){
 let h=getHist(),conf=confidence(h);
 app.innerHTML=logo()+`<h1>Full Test Results</h1><p class="sub">Only completed Full Tests appear here.</p>
 <div class="callout ${conf.ok?"ready":""}"><strong>${conf.ok?"Consistency target reached":"Confidence target"}</strong><br>${conf.msg}</div>
 ${h.length?`<table class="history"><thead><tr><th>Test</th><th>Date</th><th>Score</th></tr></thead><tbody>${h.slice().reverse().map((r,i)=>`<tr><td>#${h.length-i}</td><td>${new Date(r.ts).toLocaleString()}</td><td><strong>${r.pct}%</strong> (${r.score}/${r.total})</td></tr>`).join("")}</tbody></table>`:`<p>No full tests completed yet.</p>`}
 <div class="controls"><button class="btn primary" onclick="startTest()">Take Full Test</button><button class="btn secondary" onclick="home()">Home</button>${h.length?`<button class="btn outline" onclick="exportResults()">Export Results</button><button class="btn outline danger" onclick="clearResults()">Clear Results</button>`:""}</div>`;
}
function exportResults(){
 let blob=new Blob([JSON.stringify(getHist(),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="gibbons_biology_unit1_results.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)
}
function clearResults(){if(confirm("Clear all saved Full Test results on this browser?")){localStorage.removeItem(key);historyView()}}
home();
</script></body></html>
